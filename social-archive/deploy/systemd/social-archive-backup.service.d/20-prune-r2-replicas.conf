# 2026-08-10 Owner 决定：R2 上的备份副本只留最近 3 天（72h），更早的由 OCI/GitHub 承接。
#
# 为什么需要这条：prune_runtime_db_snapshots.py 只清本地，它的文件头明确写着
# 「不碰远端副本(R2/OCI/GitHub)……保留期是另一个决定」。那个决定一直没给，
# 于是 backups/runtime-db/ 每 15 分钟一份 1.03MB 快照累积了 512 份 / 521MB，
# 约 +99MB/天，把 R2 存储推到 5.45GB/10GB(54.5%)。R2 免费额度只有 10GB。
#
# 该脚本删 R2 对象前会先 HeadObject 核对 OCI 上同 key 同大小，核不上就跳过不删；
# 最新一批永远保留;只碰 backups/<组>/<时间戳>/,不碰 primary-objects/(制品字节)。
# 全程 Standard 存储类，零 InfrequentAccess 操作。
[Service]
ExecStart=/opt/social-archive/.venv/bin/python /opt/social-archive/scripts/prune_r2_backup_replicas.py --apply
