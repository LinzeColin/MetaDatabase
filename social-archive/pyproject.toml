[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-archive"
version = "0.0.0.60"
description = "Free, private, cross-platform saved-content archive with an E2N-like browser workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6.0.3,<7",
  "boto3>=1.43,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
social-archive-api = "social_archive.api:run"
social-archive-worker = "social_archive.worker:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_archive = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "external: requires real network, account or vendor service",
  "stage: stage integration test",
]
