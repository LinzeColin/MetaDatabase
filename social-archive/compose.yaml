name: social-archive
services:
  core-api:
    build: .
    image: social-archive/core:0.0.0.6
    command: ["social-archive-api"]
    env_file: [.env]
    ports: ["127.0.0.1:${SOCIAL_ARCHIVE_CORE_LOOPBACK_PORT:-18765}:8765"]
    volumes:
      # Core and host-side backup/replication must share one explicit bind
      # data plane. A Docker named volume would make systemd operate a
      # different SQLite/CAS tree on the host.
      - ${SOCIAL_ARCHIVE_DATA_HOST_PATH:-./runtime/data}:/var/lib/social-archive
      - ${SOCIAL_ARCHIVE_IMPORT_HOST_PATH:-./runtime/import}:/var/lib/social-archive/import
      - ${SOCIAL_ARCHIVE_VENDOR_OUTPUT_HOST_PATH:-./runtime/vendor-output}:/var/lib/social-archive/vendor-output
    # Replica credentials remain host-only: systemd gives each maintenance job
    # a short-lived credential copy instead of mounting them into Core.
    secrets: &core_secrets
      - social_archive_api_token
      - cli_worker_token
      # 登录与凭据托管（v0.0.0.7）。**不挂这三个，Core 起来就是残的**：
      # OAuth 登录返回 503、已托管的平台 Cookie 解不开——而 .env 里那几个
      # *_FILE 变量指向的正是这些路径，看起来像"配好了"。
      # 注意这里**没有**挂备份用的 age 私钥：那把仅在恢复演练时读取，
      # 不进这个 24 小时联网的容器（见 config.py 里 credential_age_* 的说明）。
      - google_oauth_client_secret
      - github_oauth_client_secret
      - credential_age_identity
      - notion_token
      - source: github_markdown_token
        target: github_token
      - obsidian_rest_token
      - karakeep_api_token
      - linkwarden_api_token
    networks: [default, social_archive_readers]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  core-worker:
    image: social-archive/core:0.0.0.6
    command: ["social-archive-worker"]
    env_file: [.env]
    volumes:
      - ${SOCIAL_ARCHIVE_DATA_HOST_PATH:-./runtime/data}:/var/lib/social-archive
      - ${SOCIAL_ARCHIVE_IMPORT_HOST_PATH:-./runtime/import}:/var/lib/social-archive/import
      - ${SOCIAL_ARCHIVE_VENDOR_OUTPUT_HOST_PATH:-./runtime/vendor-output}:/var/lib/social-archive/vendor-output
    secrets: *core_secrets
    networks: [default, social_archive_readers]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    # The image-level probe targets the API endpoint. A worker has no HTTP
    # listener, so inheriting it would permanently mark a live worker unhealthy.
    healthcheck:
      disable: true
    depends_on:
      core-api:
        condition: service_healthy
      cli-tools:
        condition: service_healthy

  cli-tools:
    build:
      context: ./sidecars/cli-tools
      additional_contexts:
        bilibili_cli: ./runtime/vendors/bilibili_cli
    image: social-archive/cli-tools:0.0.0.6
    env_file: [.env]
    environment:
      SOCIAL_ARCHIVE_CLI_OUTPUT_ROOT: /work/output/cli
      SOCIAL_ARCHIVE_CLI_WORKER_TOKEN_FILE: /run/secrets/cli_worker_token
      SOCIAL_ARCHIVE_INSTAGRAM_SESSION_FILE: /run/secrets/instagram_session
    volumes:
      - ${SOCIAL_ARCHIVE_VENDOR_OUTPUT_HOST_PATH:-./runtime/vendor-output}:/work/output
    # The Core owns the shared host tree; the CLI Sidecar writes only its
    # derived output through the explicitly configured host maintenance group.
    # Production must set this to `id -g socialarchive`, rather than relying
    # on a coincidental numeric group inside the image.
    group_add:
      - "${SOCIAL_ARCHIVE_HOST_DATA_GID:-10001}"
    secrets:
      - cli_worker_token
      - instagram_session
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5560/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

secrets:
  r2_access_key_id: {file: ./runtime/secrets/r2_access_key_id}
  r2_secret_access_key: {file: ./runtime/secrets/r2_secret_access_key}
  oci_access_key_id: {file: ./runtime/secrets/oci_access_key_id}
  oci_secret_access_key: {file: ./runtime/secrets/oci_secret_access_key}
  github_token: {file: ./runtime/secrets/github_token}
  github_markdown_token: {file: ./runtime/secrets/github_markdown_token}
  social_archive_api_token: {file: ./runtime/secrets/social_archive_api_token}
  google_oauth_client_secret: {file: ./runtime/secrets/google_oauth_client_secret}
  github_oauth_client_secret: {file: ./runtime/secrets/github_oauth_client_secret}
  credential_age_identity: {file: ./runtime/secrets/credential_age_identity}
  cli_worker_token: {file: ./runtime/secrets/cli_worker_token}
  instagram_session: {file: ./runtime/secrets/instagram_session}
  notion_token: {file: ./runtime/secrets/notion_token}
  obsidian_rest_token: {file: ./runtime/secrets/obsidian_rest_token}
  karakeep_api_token: {file: ./runtime/secrets/karakeep_api_token}
  linkwarden_api_token: {file: ./runtime/secrets/linkwarden_api_token}

networks:
  social_archive_readers:
    name: social-archive-readers
    external: true
