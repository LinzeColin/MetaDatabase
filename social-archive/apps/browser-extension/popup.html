<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Archive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">SA</span><span><strong>Social Archive</strong><small>一键保存，自动归档</small></span></div>
    <button id="settings" class="icon-button" aria-label="设置">···</button>
  </header>

  <main>
    <section class="site-card">
      <div>
        <span id="platformBadge" class="platform-badge">普通网页</span>
        <h1 id="pageTitle">正在识别当前页面…</h1>
      </div>
      <div id="authorization" class="auth-row" aria-live="polite"></div>
    </section>

    <section id="connectionSummary" class="connection-summary" aria-live="polite">正在读取连接状态…</section>

    <section class="primary-actions" aria-label="保存操作">
      <button id="savePage" class="primary-action">
        <span class="action-icon">＋</span>
        <span><strong>保存到我的档案馆</strong><small>默认归档 L0＋L1＋L3</small></span>
      </button>
      <button id="scanList" class="secondary-action">
        <span class="action-icon">≡</span>
        <span><strong>读取当前列表</strong><small>只读取当前可见内容，不自动滚动</small></span>
      </button>
    </section>

    <section class="field-grid">
      <label>
        <span>保存为</span>
        <select id="relationType">
          <option value="saved">收藏</option>
          <option value="like">点赞</option>
          <option value="bookmark">书签</option>
          <option value="watch_later">稍后看</option>
          <option value="manual_save">手动保存</option>
        </select>
      </label>
      <label>
        <span>收藏夹</span>
        <input id="collectionKey" maxlength="512" placeholder="可留空">
      </label>
    </section>

    <section class="destinations">
      <div class="section-heading"><span>自动导入到</span><button id="manageDestinations" class="text-button">管理</button></div>
      <div id="destinationChips" class="chip-list" aria-live="polite"></div>
    </section>

    <div id="status" class="status hidden" role="status" aria-live="polite"></div>
  </main>

  <footer>
    <button id="taskCenter" class="footer-button">任务中心 <span id="taskCount" class="count hidden">0</span></button>
    <button id="openLibrary" class="footer-button">打开档案馆 ↗</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
