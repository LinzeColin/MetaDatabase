<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Archive 任务中心</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">SA</span><span><strong>任务中心</strong><small>读取、下载、导出与备份</small></span></div>
    <button id="refresh" class="icon-button" aria-label="刷新">↻</button>
  </header>

  <main>
    <section id="connectionBanner" class="banner hidden"></section>
    <section class="summary" aria-label="任务概览">
      <article><strong id="runningCount">0</strong><span>处理中</span></article>
      <article><strong id="successCount">0</strong><span>已完成</span></article>
      <article><strong id="actionCount">0</strong><span>需要处理</span></article>
    </section>

    <section class="controls">
      <div class="segmented" role="tablist">
        <button class="active" data-filter="active">进行中</button>
        <button data-filter="all">全部</button>
        <button data-filter="needs_user_action">需要处理</button>
      </div>
      <button id="saveCurrent" class="quick-save">＋ 保存当前页</button>
    </section>

    <section id="empty" class="empty hidden">
      <div class="empty-icon">✓</div>
      <h2>当前没有待处理任务</h2>
      <p>从工具栏弹窗或页面悬浮按钮保存内容，进度会显示在这里。</p>
    </section>
    <section id="taskList" class="task-list" aria-live="polite"></section>
  </main>

  <footer>
    <button id="openLibrary">打开我的档案馆</button>
    <button id="openSettings">连接与导出设置</button>
  </footer>

  <template id="taskTemplate">
    <article class="task-card">
      <div class="task-head"><span class="task-icon"></span><div class="task-title"><strong></strong><small></small></div><span class="task-state"></span></div>
      <div class="progress"><span></span></div>
      <p class="task-message"></p>
      <div class="task-actions"><button class="retry hidden">重试</button><button class="details">查看详情</button></div>
    </article>
  </template>

  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
