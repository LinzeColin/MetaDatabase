name: arXiv Daily Push Liveness

# 长期稳定 watchdog: make a SILENT ZERO loud. Probes the live ADP endpoints on a schedule and goes
# RED when the system is up but silently producing nothing (P08's disease: a green cron enriching 0
# rows for weeks). Read-only, retries absorb transient edge timeouts. The decision logic is unit-tested
# network-free by tests/governance/test_adp_liveness_check.py.
#
# To stop scheduled alerts, delete the `schedule:` block below (workflow_dispatch stays for manual runs).
#
# ★ 2026-07-28 追加回写:把这个看门狗的判定**写进业务流状态**。
#   起因是一个真实的假绿 —— status 上 BL-ADP-DAILY.scan 长期显示「通」,
#   证据是 flow.yaml 里写死的一句「全 arXiv 扫描与来源输入已完成」;
#   而这个看门狗**从 07-25 起连红三天**:newest completed run ingested arXiv=0。
#   写死的自报不会过期,于是「三天没抓到一篇论文」在看板上完全看不出来。
#   判定的知识本来就在这个脚本里 —— 让它自己说,status 只读。

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC, ~1.5h after the 20:30 daily cron has finished
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: adp-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: {ref: main}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # ★ 这一步**刻意不加 continue-on-error** —— 看门狗红就该红,那是它的全部意义。
      #   输出另存一份给下面的回写用;告警本身一点不打折。
      - name: ADP liveness + silent-zero watchdog
        id: watchdog
        run: |
          set -o pipefail
          python3 scripts/adp_liveness_check.py --max-run-age-days 3 2>&1 \
            | tee "${RUNNER_TEMP}/liveness.txt"
