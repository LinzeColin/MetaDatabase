name: 阅迁生产持续验证
"on":
  workflow_dispatch:
    inputs:
      formal_account_e2e:
        description: "运行会创建并删除测试账户的真实生产 E2E"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: read
concurrency:
  group: weread-port-production-v019
  cancel-in-progress: true
jobs:
  production-smoke:
    name: 生产就绪、发布身份与安全边界
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 运行 fail-closed 生产 Smoke
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
          WRP_RELEASE_COMMIT: ${{ vars.WRP_RELEASE_COMMIT }}
          WRP_OVH_RELEASE_ID: ${{ vars.WRP_OVH_RELEASE_ID }}
          WRP_SITES_PROJECT_ID: ${{ vars.WRP_SITES_PROJECT_ID }}
        run: >-
          python3 WeReadPort/scripts/smoke-site.py "$WEREAD_PORT_SITE_URL"
          --expected-commit "$WRP_RELEASE_COMMIT"
          --expected-ovh-release-id "$WRP_OVH_RELEASE_ID"
          --expected-sites-project-id "$WRP_SITES_PROJECT_ID"
  formal-account-e2e:
    name: 注册、登录、持久化、跨设备、隔离、导入、画像与微信读书
    if: github.event_name == 'workflow_dispatch' && inputs.formal_account_e2e
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: WeReadPort
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 安装浏览器验收依赖
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: 运行真实生产账户 E2E
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
          WRP_E2E_WEREAD_KEY: ${{ secrets.WRP_E2E_WEREAD_KEY }}
          WRP_E2E_EMAIL_DOMAIN: ${{ vars.WRP_E2E_EMAIL_DOMAIN }}
        run: python3 tests/browser/production_account_e2e.py --url "$WEREAD_PORT_SITE_URL"
