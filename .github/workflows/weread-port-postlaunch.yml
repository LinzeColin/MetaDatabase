name: 微信读书笔记迁移上线后自动验证

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: 微信读书笔记迁移-生产冒烟
  cancel-in-progress: true

jobs:
  production-smoke:
    name: 生产公开页面、就绪与安全边界冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 运行有界生产冒烟
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL || 'https://weread-port.linzezhang35.chatgpt.site' }}
        run: python3 WeReadPort/scripts/smoke-site.py "$WEREAD_PORT_SITE_URL"
