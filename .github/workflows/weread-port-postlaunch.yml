name: 微信读书笔记迁移上线后自动验证

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  生产冒烟:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 检查生产网址配置
        id: config
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
        shell: bash
        run: |
          if [[ "$WEREAD_PORT_SITE_URL" == https://* ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "生产网址尚未配置；上线前保持非阻塞跳过，不制造失败噪音。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 运行有界生产冒烟
        if: steps.config.outputs.configured == 'true'
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
        run: python3 WeReadPort/scripts/smoke-site.py "$WEREAD_PORT_SITE_URL"
