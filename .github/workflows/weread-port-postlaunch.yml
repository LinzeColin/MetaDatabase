name: 阅迁生产持续验证
"on":
  workflow_dispatch:
    inputs:
      core_account_e2e:
        description: "运行会创建并删除测试账户的真实核心账户 E2E（不调用微信读书）"
        required: true
        type: boolean
        default: false
      formal_account_e2e:
        description: "运行会创建并删除测试账户的真实生产 E2E"
        required: true
        type: boolean
        default: false
  schedule:
    # 每日：只读生产 Smoke（发布身份、/readyz、安全边界）。
    - cron: "23 2 * * *"
    # 每周一：真实账户 E2E（注册→登录→跨设备→检索→微信读书同步→读回正文→导出→删号）。
    #
    # R2 月操作量预算（桶 weread-port-private，AGENTS.md「算不出来就不上线」）：
    #   设测试密钥账号同步出 K 条笔记（脚本以 WRP_E2E_MAX_SYNCED_NOTES=2000 为上限，超出即失败）。
    #   每轮 Class A（PUT）：/readyz 探针 1 + 手写笔记 1 + Obsidian 1 + 同步 K = K+3
    #   每轮 Class B（GET）：探针 1 + 写后校验 3+K + 第二设备读 1 + 读回 1 + 导出 K+2 ≈ 2K+8
    #   删号的 DeleteObject 在 R2 不计费；测试账户删除后存储净增 0。
    #   上限 K=2000、每月最多 5 轮：Class A 5×2003=10,015（1.0% of 1M），
    #   Class B 5×4008=20,040（0.2% of 10M），均远低于免费额度的 50%。
    - cron: "47 3 * * 1"
permissions:
  contents: read
concurrency:
  group: weread-port-production-v019
  cancel-in-progress: true
jobs:
  production-smoke:
    name: 生产就绪、发布身份与安全边界
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 运行 fail-closed 生产 Smoke
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
          WRP_RELEASE_COMMIT: ${{ vars.WRP_RELEASE_COMMIT }}
          WRP_OVH_RELEASE_ID: ${{ vars.WRP_OVH_RELEASE_ID }}
          WRP_EDGE_DEPLOYMENT_ID: ${{ vars.WRP_EDGE_DEPLOYMENT_ID }}
        run: >-
          python3 WeReadPort/scripts/smoke-site.py "$WEREAD_PORT_SITE_URL"
          --expected-commit "$WRP_RELEASE_COMMIT"
          --expected-ovh-release-id "$WRP_OVH_RELEASE_ID"
          --expected-edge-deployment-id "$WRP_EDGE_DEPLOYMENT_ID"
  core-account-e2e:
    name: 注册、登录、持久化、跨设备、隔离、导入、画像与删除
    if: github.event_name == 'workflow_dispatch' && inputs.core_account_e2e
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: WeReadPort
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 安装浏览器验收依赖
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: 运行真实生产核心账户 E2E
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
          WRP_E2E_EMAIL_DOMAIN: ${{ vars.WRP_E2E_EMAIL_DOMAIN }}
        run: python3 tests/browser/production_account_e2e.py --core-only --url "$WEREAD_PORT_SITE_URL"
  formal-account-e2e:
    name: 注册、登录、持久化、跨设备、隔离、导入、画像与微信读书
    # 定时只在每周那条 cron 上跑；缺 WRP_E2E_WEREAD_KEY 时脚本直接失败，不跳过。
    if: (github.event_name == 'workflow_dispatch' && inputs.formal_account_e2e) || (github.event_name == 'schedule' && github.event.schedule == '47 3 * * 1')
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: WeReadPort
    steps:
      - name: 读取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 安装浏览器验收依赖
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: 运行真实生产账户 E2E
        env:
          WEREAD_PORT_SITE_URL: ${{ vars.WEREAD_PORT_SITE_URL }}
          WRP_E2E_WEREAD_KEY: ${{ secrets.WRP_E2E_WEREAD_KEY }}
          WRP_E2E_EMAIL_DOMAIN: ${{ vars.WRP_E2E_EMAIL_DOMAIN }}
        run: python3 tests/browser/production_account_e2e.py --url "$WEREAD_PORT_SITE_URL"
