name: MooMooAU protected Parser Timeline Blue-Green

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact main commit to execute
        required: true
        type: string
      confirm_blue_green:
        description: Confirm same-Raw candidate shadow and single Timeline only
        required: true
        type: choice
        options:
          - BLUE_GREEN_SAME_RECOVERED_RAW_SHADOW_ONLY

permissions:
  contents: read

concurrency:
  group: moomooau-blue-green-single-writer
  cancel-in-progress: false

jobs:
  blue-green-authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      m3_receipt_sha256: ${{ steps.blue-green-contract.outputs.m3_receipt_sha256 }}
      blue_green_gate_sha256: ${{ steps.blue-green-contract.outputs.blue_green_gate_sha256 }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fail closed on invalid protected Blue-Green dispatch context
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          BLUE_GREEN_CONFIRMATION: ${{ inputs.confirm_blue_green }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY_ID" = "1300525906"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "68840188"
          test "$GITHUB_ACTOR_ID" = "68840188"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = \
            "LinzeColin/MetaDatabase/.github/workflows/moomooau-blue-green.yml@refs/heads/main"
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
          test "$BLUE_GREEN_CONFIRMATION" = \
            "BLUE_GREEN_SAME_RECOVERED_RAW_SHADOW_ONLY"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact main tree without retained credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-verified official age for the protected oracle
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Install cumulative immutable dependencies and package
        working-directory: LinzeDatabase/MooMooAU
        run: |
          python -m pip install --require-hashes -r requirements/stage6.lock
          python -m pip install --no-build-isolation --no-deps .

      - name: Revalidate T0703 receipt and T0704 boundaries without protected inputs
        working-directory: LinzeDatabase/MooMooAU
        run: |
          python -m ruff format --check \
            src/moomooau_archive/document_parser.py \
            src/moomooau_archive/blue_green_runtime.py \
            src/moomooau_archive/github_guard.py \
            src/moomooau_archive/protected_beta.py \
            src/moomooau_archive/protected_m3.py \
            src/moomooau_archive/protected_blue_green.py \
            src/moomooau_archive/protected_blue_green_entrypoint.py \
            tests/stage7_support.py \
            tests/tasks/test_t0703.py \
            tests/tasks/test_t0704.py
          python -m ruff check --no-cache \
            src/moomooau_archive/document_parser.py \
            src/moomooau_archive/blue_green_runtime.py \
            src/moomooau_archive/github_guard.py \
            src/moomooau_archive/protected_beta.py \
            src/moomooau_archive/protected_m3.py \
            src/moomooau_archive/protected_blue_green.py \
            src/moomooau_archive/protected_blue_green_entrypoint.py \
            tests/stage7_support.py \
            tests/tasks/test_t0703.py \
            tests/tasks/test_t0704.py
          python -m mypy --no-incremental --cache-dir "$RUNNER_TEMP/mypy-cache" \
            src/moomooau_archive/document_parser.py \
            src/moomooau_archive/blue_green_runtime.py \
            src/moomooau_archive/github_guard.py \
            src/moomooau_archive/protected_beta.py \
            src/moomooau_archive/protected_m3.py \
            src/moomooau_archive/protected_blue_green.py \
            src/moomooau_archive/protected_blue_green_entrypoint.py
          python -m pytest -q tests/tasks/test_t0703.py tests/tasks/test_t0704.py
          python machine/tools/validate_package.py
          python machine/tools/validate_delivery_status.py
          python machine/tools/validate_publication.py

      - name: Bind dispatch to T0703 PASS and explicit T0704 authority
        id: blue-green-contract
        working-directory: LinzeDatabase/MooMooAU
        shell: bash
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/moomooau-blue-green-contract.json"
          python -m moomooau_archive.protected_blue_green_entrypoint \
            --contract-only --project-root "$PWD" > "$contract"
          python -c \
            'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value["blue_green_authorized"] is True; output=open(sys.argv[2], "a", encoding="utf-8"); print("m3_receipt_sha256="+value["m3_receipt_sha256"], file=output); print("blue_green_gate_sha256="+value["blue_green_gate_sha256"], file=output)' \
            "$contract" "$GITHUB_OUTPUT"

  blue-green-shadow-and-timeline:
    needs: blue-green-authority-gate
    environment: moomooau-beta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fail closed on non-cloud protected Blue-Green runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - name: Check out exact main tree without retained credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-verified official age
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Install cumulative immutable dependencies and package
        working-directory: LinzeDatabase/MooMooAU
        run: |
          python -m pip install --require-hashes -r requirements/stage6.lock
          python -m pip install --no-build-isolation --no-deps .

      - name: Execute exactly one protected candidate shadow and single Timeline publish
        working-directory: LinzeDatabase/MooMooAU
        env:
          MOOMOOAU_PROTECTED_ENVIRONMENT: moomooau-beta
          MOOMOOAU_BETA_CONFIG: ${{ secrets.MOOMOOAU_BETA_CONFIG }}
          MOOMOOAU_SENDER_REGISTRY: ${{ secrets.MOOMOOAU_SENDER_REGISTRY }}
          MOOMOOAU_CLASSIFICATION_REGISTRY: ${{ secrets.MOOMOOAU_CLASSIFICATION_REGISTRY }}
          MOOMOOAU_PARSER_REGISTRY: ${{ secrets.MOOMOOAU_PARSER_REGISTRY }}
          MOOMOOAU_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOOMOOAU_GITHUB_APP_PRIVATE_KEY }}
          MOOMOOAU_AGE_IDENTITY: ${{ secrets.MOOMOOAU_AGE_IDENTITY }}
          MOOMOOAU_OPAQUE_ID_KEY: ${{ secrets.MOOMOOAU_OPAQUE_ID_KEY }}
          MOOMOOAU_GMAIL_OAUTH: ${{ secrets.MOOMOOAU_GMAIL_OAUTH }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          M3_RECEIPT_SHA256: ${{ needs.blue-green-authority-gate.outputs.m3_receipt_sha256 }}
          BLUE_GREEN_GATE_SHA256: ${{ needs.blue-green-authority-gate.outputs.blue_green_gate_sha256 }}
          BLUE_GREEN_CONFIRMATION: ${{ inputs.confirm_blue_green }}
        run: >-
          python -m moomooau_archive.protected_blue_green_entrypoint
          --execute-protected
          --project-root "$PWD"
          --expected-head-sha "$EXPECTED_HEAD_SHA"
          --m3-receipt-sha256 "$M3_RECEIPT_SHA256"
          --blue-green-gate-sha256 "$BLUE_GREEN_GATE_SHA256"
          --confirm "$BLUE_GREEN_CONFIRMATION"

      - name: Verify protected Blue-Green identity plaintext was removed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if find /dev/shm -mindepth 1 -maxdepth 1 -type d \
            -name 'moomooau-protected-blue-green-*' -print -quit | grep -q .; then
            echo "::error::Protected Blue-Green identity directory remains in tmpfs."
            exit 1
          fi
