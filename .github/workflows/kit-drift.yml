name: Kit Drift

# 单独一个 workflow，不并进 dual-plane.yml —— 那个文件的 sha256 被钉在
# ABD 的 S00 阶段复审契约里（REVIEW-PIN-DUAL-PLANE），改它 ABD 的门就红。
# 那道锁是为了让「改 CI」变成显式动作，不该被一个治理 PR 顺手解开。
# 实测：新增 workflow 文件不触发 REVIEW-PIN-DUAL-PLANE / REVIEW-PIN-CI-WORKFLOW-SET。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: kit 副本必须与 Governance 唯一真源一致
        run: |
          set -euo pipefail
          SCRIPT="machine/tools/check_kit_drift.py"
          [ -f "$SCRIPT" ] || { echo "FAIL: 缺少 $SCRIPT"; exit 1; }
          python3 "$SCRIPT" --root .
      - name: 安装 PyYAML（MooMooAU 双平面渲染需要）
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: MooMooAU 渲染一致门（零 vendoring —— 它有反复制守卫）
        run: |
          set -euo pipefail
          # MooMooAU 不被 dual-plane.yml 的 --projects 列表覆盖，此前没有任何门
          # 盯着它的文档是否偏离事实源 —— 2026-08-18 实测：changelog 20 条，
          # 运维手册显示的是最旧 10 条，积了三周没人发现。
          #
          # 但**不能**照别的项目那样把 kit 工具复制进去：MooMooAU 自己的
          # validate_stage0.py 有一道 governance.no_framework_copy，
          # 复制共享工具进 machine/tools/ 就 FAIL。那是它有意的设计，不是疏漏
          # ——它是全工作间唯一不 vendoring 的项目。
          # （我在 #293 里正是这么踩的，本次一并撤销。）
          #
          # 改用外部渲染器 + 比对，同样能拦住漂移，零新增文件。
          python3 LinzeDatabase/machine/tools/render_human.py --root LinzeDatabase/MooMooAU
          git diff --exit-code -- LinzeDatabase/MooMooAU/文档 || {
            echo "FAIL: MooMooAU 文档与 machine/facts 不一致（人类平面被手工改，或事实源变了没重渲染）"
            exit 1
          }
