name: Desktop app suite release

on:
  push:
    branches: [main]
    paths:
      - "Kimi-Code-Desktop/**"
      - "Harness-UI/**"
      - "desktop-suite/**"
      - "scripts/validate-desktop-suite-contract.mjs"
      - ".github/workflows/desktop-app-suite-release.yml"
      - ".github/workflows/upstream-desktop-sync.yml"
      - ".github/workflows/kimi-harness-ci.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_DESKTOP_APP_SUITE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-app-suite-release-main
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kimi_version: ${{ steps.values.outputs.kimi_version }}
      harness_version: ${{ steps.values.outputs.harness_version }}
      dsh_version: ${{ steps.values.outputs.dsh_version }}
      kimi_tag: ${{ steps.values.outputs.kimi_tag }}
      harness_tag: ${{ steps.values.outputs.harness_tag }}
      dsh_tag: ${{ steps.values.outputs.dsh_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate the desktop suite compatibility contract
        run: node scripts/validate-desktop-suite-contract.mjs
      - name: Lock product versions to their canonical sources
        id: values
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          kimi_version="$(node -p "require('./Kimi-Code-Desktop/package.json').version")"
          harness_version="$(node -p "require('./Harness-UI/package.json').version")"
          dsh_version="$(node -p "require('./desktop-suite/COMPATIBILITY_CONTRACT.json').applications.dshDesktop.version")"
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM" = "RELEASE_DESKTOP_APP_SUITE"
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current_main" = "$GITHUB_SHA"
          test "$(gh api repos/MoonshotAI/kimi-code/releases/latest --jq .tag_name)" = "@moonshot-ai/kimi-code@$kimi_version"
          test "$(gh api repos/anywhere-labs/deepseek-harness-desktop/releases/latest --jq .tag_name)" = "v$dsh_version"
          printf 'kimi_version=%s\n' "$kimi_version" >> "$GITHUB_OUTPUT"
          printf 'harness_version=%s\n' "$harness_version" >> "$GITHUB_OUTPUT"
          printf 'dsh_version=%s\n' "$dsh_version" >> "$GITHUB_OUTPUT"
          printf 'kimi_tag=kimi-code-desktop-v%s\n' "$kimi_version" >> "$GITHUB_OUTPUT"
          printf 'harness_tag=harness-ui-v%s\n' "$harness_version" >> "$GITHUB_OUTPUT"
          printf 'dsh_tag=dsh-desktop-v%s\n' "$dsh_version" >> "$GITHUB_OUTPUT"

  macos:
    needs: guard
    runs-on: macos-15
    timeout-minutes: 55
    env:
      KIMI_VERSION: ${{ needs.guard.outputs.kimi_version }}
      HARNESS_VERSION: ${{ needs.guard.outputs.harness_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Kimi-Code-Desktop/package-lock.json
      - name: Build Harness UI Apple Silicon assets
        run: |
          swift test --package-path Harness-UI/macos
          APP_VERSION="$HARNESS_VERSION" Harness-UI/macos/scripts/build-app.sh
          app="Harness-UI/dist/macos-arm64/Harness UI.app"
          assets="$RUNNER_TEMP/suite-harness-macos"
          staging="$RUNNER_TEMP/suite-harness-dmg"
          mkdir -p "$assets" "$staging"
          ditto "$app" "$staging/Harness UI.app"
          ln -s /Applications "$staging/Applications"
          ditto -c -k --keepParent "$app" "$assets/Harness-UI-$HARNESS_VERSION-mac-arm64.zip"
          hdiutil create -volname "Harness UI" -srcfolder "$staging" -ov -format UDZO \
            "$assets/Harness-UI-$HARNESS_VERSION-mac-arm64.dmg"
      - name: Build Kimi Code Desktop for both Mac architectures
        working-directory: Kimi-Code-Desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
          KIMI_STABLE_ADHOC_IDENTITY: "1"
          KIMI_DISTRIBUTION_REVISION: github-run-${{ github.run_id }}
        run: |
          node -e "require('node:fs').writeFileSync('src/distribution-revision.json', JSON.stringify({schema:1,revision:process.env.KIMI_DISTRIBUTION_REVISION}, null, 2) + '\n')"
          npm ci
          npm test
          assets="$RUNNER_TEMP/suite-kimi-macos"
          mkdir -p "$assets"
          for arch in arm64 x64; do
            npm run prepare:kimi -- --platform=darwin --arch="$arch"
            output="dist-suite/$arch"
            npx electron-builder --mac dmg zip "--$arch" "--config.directories.output=$output" \
              --config.mac.identity=- --config.mac.hardenedRuntime=false
            cp "$output/Kimi Code Desktop-$KIMI_VERSION-mac-$arch.dmg" "$assets/"
            cp "$output/Kimi Code Desktop-$KIMI_VERSION-mac-$arch.zip" "$assets/"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: suite-harness-macos
          path: ${{ runner.temp }}/suite-harness-macos/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: suite-kimi-macos
          path: ${{ runner.temp }}/suite-kimi-macos/*
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      KIMI_VERSION: ${{ needs.guard.outputs.kimi_version }}
      HARNESS_VERSION: ${{ needs.guard.outputs.harness_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Kimi-Code-Desktop/package-lock.json
      - name: Build Harness UI Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP "suite-harness-windows"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found" }
          dotnet test Harness-UI/windows/tests/HarnessUI.Windows.Tests.csproj -c Release
          foreach ($arch in @("x64", "arm64")) {
            $publish = "Harness-UI/dist/windows-$arch"
            dotnet publish Harness-UI/windows/HarnessUI.Windows.csproj -c Release -r "win-$arch" --self-contained true -o $publish
            Compress-Archive -Path "$publish/*" -DestinationPath "$assets/Harness-UI-$env:HARNESS_VERSION-windows-$arch-portable.zip" -Force
            & $iscc "/DAppVersion=$env:HARNESS_VERSION" "/DAppArch=$arch" "/DSourceDir=$((Resolve-Path $publish).Path)" "Harness-UI/windows/installer.iss"
            Copy-Item "Harness-UI/dist/Harness-UI-$env:HARNESS_VERSION-windows-$arch-setup.exe" $assets
          }
      - name: Build Kimi Code Desktop Windows assets
        working-directory: Kimi-Code-Desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KIMI_DISTRIBUTION_REVISION: github-run-${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP "suite-kimi-windows"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          node -e "require('node:fs').writeFileSync('src/distribution-revision.json', JSON.stringify({schema:1,revision:process.env.KIMI_DISTRIBUTION_REVISION}, null, 2) + '\n')"
          npm ci
          npm test
          foreach ($arch in @("x64", "arm64")) {
            $output = "dist-suite/$arch"
            npm run prepare:kimi -- --platform=win32 --arch=$arch
            npx electron-builder --win nsis zip "--$arch" "--config.directories.output=$output"
            Copy-Item "$output/Kimi Code Desktop-$env:KIMI_VERSION-win-$arch.exe" $assets
            Copy-Item "$output/Kimi Code Desktop-$env:KIMI_VERSION-win-$arch.zip" $assets
          }
      - uses: actions/upload-artifact@v7
        with:
          name: suite-harness-windows
          path: ${{ runner.temp }}/suite-harness-windows/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: suite-kimi-windows
          path: ${{ runner.temp }}/suite-kimi-windows/*
          if-no-files-found: error
          retention-days: 1

  dsh:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mirror official DSH installers and package the HarnessUI bridge
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.guard.outputs.dsh_version }}
        run: |
          mkdir -p release-assets
          gh release download "v$DSH_VERSION" \
            --repo anywhere-labs/deepseek-harness-desktop \
            --dir release-assets
          cd Harness-UI
          zip -r "../release-assets/DSH-Desktop-$DSH_VERSION-HarnessUI-bridge.zip" \
            dsh-desktop dsh-plugin scripts/install-dsh.mjs LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: suite-dsh
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish-suite:
    needs: [guard, macos, windows, dsh]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: suite-kimi-*
          path: release-assets/kimi
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: suite-harness-*
          path: release-assets/harness
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: suite-dsh
          path: release-assets/dsh
      - name: Assemble one provenance record for all three apps
        env:
          KIMI_VERSION: ${{ needs.guard.outputs.kimi_version }}
          HARNESS_VERSION: ${{ needs.guard.outputs.harness_version }}
          DSH_VERSION: ${{ needs.guard.outputs.dsh_version }}
          KIMI_TAG: ${{ needs.guard.outputs.kimi_tag }}
          HARNESS_TAG: ${{ needs.guard.outputs.harness_tag }}
          DSH_TAG: ${{ needs.guard.outputs.dsh_tag }}
          KIMI_DISTRIBUTION_REVISION: github-run-${{ github.run_id }}
        run: |
          cd Harness-UI
          zip -r "../release-assets/harness/Harness-UI-$HARNESS_VERSION-DSH-adapter.zip" \
            dsh-plugin scripts/install-dsh.mjs LICENSE README.md
          cd ..
          printf '{\n  "schema": 1,\n  "version": "%s",\n  "revision": "%s"\n}\n' \
            "$KIMI_VERSION" "$KIMI_DISTRIBUTION_REVISION" \
            > "release-assets/kimi/Kimi.Code.Desktop-$KIMI_VERSION-release.json"
          node <<'NODE'
          const fs = require("node:fs");
          const record = {
            schema: 1,
            repository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.GITHUB_SHA,
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            applications: {
              kimiCode: { version: process.env.KIMI_VERSION, tag: process.env.KIMI_TAG },
              harnessUI: { version: process.env.HARNESS_VERSION, tag: process.env.HARNESS_TAG },
              dshDesktop: { version: process.env.DSH_VERSION, tag: process.env.DSH_TAG },
            },
          };
          const contents = JSON.stringify(record, null, 2) + "\n";
          for (const directory of ["kimi", "harness", "dsh"]) {
            fs.writeFileSync("release-assets/" + directory + "/Desktop.App.Suite-release.json", contents);
          }
          NODE
      - name: Publish the indivisible desktop app suite
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_VERSION: ${{ needs.guard.outputs.kimi_version }}
          HARNESS_VERSION: ${{ needs.guard.outputs.harness_version }}
          DSH_VERSION: ${{ needs.guard.outputs.dsh_version }}
          KIMI_TAG: ${{ needs.guard.outputs.kimi_tag }}
          HARNESS_TAG: ${{ needs.guard.outputs.harness_tag }}
          DSH_TAG: ${{ needs.guard.outputs.dsh_tag }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current_main" = "$GITHUB_SHA"

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            local directory="$4"
            local expected="$5"
            mapfile -d '' assets < <(find "$directory" -maxdepth 1 -type f -print0 | sort -z)
            test "${#assets[@]}" = "$expected"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
              release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -f target_commitish="$GITHUB_SHA" >/dev/null
              gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$tag" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
                --title "$title" --notes-file "$notes"
            fi
          }

          publish_release "$KIMI_TAG" "Kimi Code Desktop v$KIMI_VERSION" \
            Kimi-Code-Desktop/docs/RELEASE.md release-assets/kimi 10
          publish_release "$HARNESS_TAG" "Harness UI v$HARNESS_VERSION" \
            Harness-UI/docs/RELEASE.md release-assets/harness 8
          publish_release "$DSH_TAG" "DSH Desktop v$DSH_VERSION" \
            Harness-UI/dsh-desktop/RELEASE.md release-assets/dsh 4

          for tag in "$KIMI_TAG" "$HARNESS_TAG" "$DSH_TAG"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .target_commitish)" = "$GITHUB_SHA"
          done
