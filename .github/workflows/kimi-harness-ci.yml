name: Kimi and Harness cross-platform CI

on:
  push:
    branches: [main]
    paths:
      - "Kimi-Code-Desktop/**"
      - "Harness-UI/**"
      - ".github/workflows/kimi-code-desktop-release.yml"
      - ".github/workflows/harness-ui-release.yml"
      - ".github/workflows/kimi-harness-community-release.yml"
      - ".github/workflows/kimi-harness-ci.yml"
  pull_request:
    paths:
      - "Kimi-Code-Desktop/**"
      - "Harness-UI/**"
      - ".github/workflows/kimi-code-desktop-release.yml"
      - ".github/workflows/harness-ui-release.yml"
      - ".github/workflows/kimi-harness-community-release.yml"
      - ".github/workflows/kimi-harness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimi-harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: kimi
            directory: Kimi-Code-Desktop
          - project: harness
            directory: Harness-UI
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Run unit tests
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Build fixture catalog
        if: matrix.project == 'harness'
        working-directory: Harness-UI
        run: npm run validate:fixtures
      - name: Audit production dependency graph
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev --audit-level=high

  macos:
    name: macOS Apple Silicon candidates
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Kimi-Code-Desktop/package-lock.json
      - name: Build and test Harness UI AppKit app
        run: |
          swift test --package-path Harness-UI/macos
          Harness-UI/macos/scripts/build-app.sh
          app="Harness-UI/dist/macos-arm64/Harness UI.app"
          version="$(node -p 'require("./Harness-UI/package.json").version')"
          zip="Harness-UI/dist/Harness-UI-$version-mac-arm64.zip"
          dmg="Harness-UI/dist/Harness-UI-$version-mac-arm64.dmg"
          staging="$RUNNER_TEMP/harness-ui-dmg"
          mkdir -p "$staging"
          ditto "$app" "$staging/Harness UI.app"
          ln -s /Applications "$staging/Applications"
          ditto -c -k --keepParent "$app" "$zip"
          hdiutil create -volname "Harness UI" -srcfolder "$staging" -ov -format UDZO "$dmg"
          file "$app/Contents/MacOS/Harness UI"
          plutil -lint "$app/Contents/Info.plist"
          test -f "$zip"
          test -f "$dmg"
      - name: Build Kimi Code Desktop arm64 DMG and ZIP
        working-directory: Kimi-Code-Desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm test
          npm run prepare:kimi -- --platform=darwin --arch=arm64
          npx electron-builder --mac dmg zip --arm64 --config.directories.output=dist-ci
          version="$(node -p 'require("./package.json").version')"
          file "dist-ci/mac-arm64/Kimi Code Desktop.app/Contents/MacOS/Kimi Code Desktop"
          file "dist-ci/mac-arm64/Kimi Code Desktop.app/Contents/Resources/kimi/kimi"
          test -f "dist-ci/Kimi Code Desktop-$version-mac-arm64.dmg"
          test -f "dist-ci/Kimi Code Desktop-$version-mac-arm64.zip"

  windows:
    name: Windows x64 and arm64 candidates
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Kimi-Code-Desktop/package-lock.json
      - name: Test and publish Harness UI for both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test Harness-UI/windows/tests/HarnessUI.Windows.Tests.csproj -c Release
          dotnet publish Harness-UI/windows/HarnessUI.Windows.csproj -c Release -r win-x64 --self-contained true -o Harness-UI/dist/windows-x64
          dotnet publish Harness-UI/windows/HarnessUI.Windows.csproj -c Release -r win-arm64 --self-contained true -o Harness-UI/dist/windows-arm64
          Get-Item Harness-UI/dist/windows-x64/HarnessUI.exe
          Get-Item Harness-UI/dist/windows-arm64/HarnessUI.exe
          $version = node -p "require('./Harness-UI/package.json').version"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found" }
          & $iscc "/DAppVersion=$version" "/DAppArch=x64" "/DSourceDir=$((Resolve-Path 'Harness-UI/dist/windows-x64').Path)" "Harness-UI/windows/installer.iss"
          & $iscc "/DAppVersion=$version" "/DAppArch=arm64" "/DSourceDir=$((Resolve-Path 'Harness-UI/dist/windows-arm64').Path)" "Harness-UI/windows/installer.iss"
          Compress-Archive -Path "Harness-UI/dist/windows-x64/*" -DestinationPath "Harness-UI/dist/Harness-UI-$version-windows-x64.zip" -Force
          Compress-Archive -Path "Harness-UI/dist/windows-arm64/*" -DestinationPath "Harness-UI/dist/Harness-UI-$version-windows-arm64.zip" -Force
          Get-Item "Harness-UI/dist/Harness-UI-$version-windows-x64-setup.exe"
          Get-Item "Harness-UI/dist/Harness-UI-$version-windows-arm64-setup.exe"
          Get-Item "Harness-UI/dist/Harness-UI-$version-windows-x64.zip"
          Get-Item "Harness-UI/dist/Harness-UI-$version-windows-arm64.zip"
      - name: Build Kimi Code Desktop for both architectures
        working-directory: Kimi-Code-Desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          $version = node -p "require('./package.json').version"
          npm run prepare:kimi -- --platform=win32 --arch=x64
          npx electron-builder --win nsis zip --x64 --config.directories.output=dist-ci/x64
          npm run prepare:kimi -- --platform=win32 --arch=arm64
          npx electron-builder --win nsis zip --arm64 --config.directories.output=dist-ci/arm64
          Get-Item "dist-ci/x64/Kimi Code Desktop-$version-win-x64.exe"
          Get-Item "dist-ci/x64/Kimi Code Desktop-$version-win-x64.zip"
          Get-Item "dist-ci/arm64/Kimi Code Desktop-$version-win-arm64.exe"
          Get-Item "dist-ci/arm64/Kimi Code Desktop-$version-win-arm64.zip"
