name: Stock Skill validation

on:
  push:
    branches: [main]
    paths:
      - "Signal-Lattice/Stock_Skill/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/stock-skill-validation.yml"
  pull_request:
    paths:
      - "Signal-Lattice/Stock_Skill/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/stock-skill-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-skill-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate registry and registered artifacts
        run: python3 -B Signal-Lattice/Stock_Skill/scripts/validate_registry.py

      # ★ 每个技能包的根目录都要能被 import,否则套件里**在进程内**直接
      #   `import <包名>` 的测试必然炸:
      #     ERROR: test_capacity   ModuleNotFoundError: No module named 'equity_foresight_signal'
      #     ERROR: test_dataset    同上
      #   原因:unittest.discover 只把 start_dir(即 tests/)放进 sys.path,
      #   而被测包在**父目录**。同目录别的测试之所以没事,是因为它们走
      #   subprocess(cwd=父目录)起 `python -m <包名>`,从不在进程内导入 ——
      #   两种写法混在一个目录里,这个坑才藏了这么久。
      #
      # ★★ 更要紧的后果:run_unittests.py 里 `if result.returncode != 0: return`,
      #   **第一个套件失败就整体返回**。equity-foresight-signal 排第三,
      #   于是它后面的 global-equity-lead-lag / stock-commercial-opportunities /
      #   Stock_Skill/tests 这三个套件**从来没有在 CI 里被执行过**。
      #   实测:修好之后 338 → 640 条,多出来的 302 条不是新写的,是一直没跑的。
      #
      # ★ 为什么把修改点放在这里、而不是改 run_unittests.py:
      #   bottleneck-serenity-skill 的完成度审计 validate_changed_path_scope()
      #   有一份改动路径允许清单,`Stock_Skill/scripts/run_unittests.py` 不在里面
      #   (而同目录的 validate_registry.py / validate_public_safety.py 都在),
      #   动它会被判 `changed paths escape Stock Skill allowlist`。
      #   把自己的文件加进那份允许清单来让自己变绿 —— 不做。
      #   本文件 `.github/workflows/stock-skill-validation.yml` **本来就在允许清单里**,
      #   且不在任何 SHA256SUMS / BACKUP_MANIFEST 里,改它不碰任何受保护面。
      - name: Run every Stock Skill unittest suite
        run: |
          set -euo pipefail
          # 每个含 tests/ 的技能包根目录都加进 PYTHONPATH;子进程继承,套件间互不影响
          PYTHONPATH="$(python3 -c "import os,pathlib;print(os.pathsep.join(sorted({str(p.parent.resolve()) for p in pathlib.Path('Signal-Lattice/Stock_Skill').rglob('tests') if p.is_dir()})))")"
          export PYTHONPATH
          echo "PYTHONPATH 覆盖 $(printf '%s' "$PYTHONPATH" | tr ':' '\n' | grep -c .) 个技能包根目录"
          python3 -B Signal-Lattice/Stock_Skill/scripts/run_unittests.py

      - name: Verify every Stock Skill manifest and SHA256SUMS
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import unicodedata

          stock_root = Path("Signal-Lattice/Stock_Skill")
          manifest_line = re.compile(r"([0-9a-f]{64})  \./(.+)")
          sums_line = re.compile(r"([0-9a-f]{64})  (.+)")
          errors: list[str] = []


          def digest(path: Path) -> str:
              value = sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()


          def safe_relative(base: Path, raw: str, label: str):
              posix = PurePosixPath(raw)
              if (
                  not raw
                  or raw.startswith("/")
                  or raw != unicodedata.normalize("NFC", raw)
                  or raw != posix.as_posix()
                  or any(part in {"", ".", ".."} for part in posix.parts)
              ):
                  errors.append(f"{label}: unsafe or non-canonical path {raw!r}")
                  return None
              target = base.joinpath(*posix.parts)
              current = base
              for part in posix.parts:
                  current = current / part
                  if current.is_symlink():
                      errors.append(f"{label}: symlink path component {current}")
                      return None
              try:
                  target.resolve().relative_to(base.resolve())
              except (OSError, ValueError):
                  errors.append(f"{label}: path escapes base {raw!r}")
                  return None
              return target


          def actual_files(base: Path, control: Path, label: str) -> set[str]:
              actual: set[str] = set()
              for path in base.rglob("*"):
                  if path == control or "__pycache__" in path.parts:
                      continue
                  relative = path.relative_to(base).as_posix()
                  if path.is_symlink():
                      errors.append(f"{label}: symlink is prohibited: {relative}")
                      continue
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      continue
                  if not stat.S_ISREG(mode):
                      errors.append(f"{label}: non-regular file is prohibited: {relative}")
                      continue
                  actual.add(relative)
              return actual


          def verify_control_file(path: Path, line_pattern: re.Pattern[str], dot_prefix: bool) -> None:
              label = path.as_posix()
              if path.is_symlink() or not stat.S_ISREG(path.lstat().st_mode):
                  errors.append(f"{label}: control file must be a regular non-symlink")
                  return
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines:
                  errors.append(f"{label}: control file must not be empty")
                  return
              declared: set[str] = set()
              for number, line in enumerate(lines, 1):
                  match = line_pattern.fullmatch(line)
                  if not match:
                      errors.append(f"{label}:{number}: invalid hash line")
                      continue
                  raw = match.group(2)
                  if dot_prefix and line != f"{match.group(1)}  ./{raw}":
                      errors.append(f"{label}:{number}: missing canonical ./ prefix")
                      continue
                  if raw in declared:
                      errors.append(f"{label}:{number}: duplicate path {raw!r}")
                      continue
                  declared.add(raw)
                  target = safe_relative(path.parent, raw, f"{label}:{number}")
                  if target is None:
                      continue
                  if not target.exists() or target.is_symlink() or not target.is_file():
                      errors.append(f"{label}:{number}: missing regular file {raw!r}")
                      continue
                  actual_hash = digest(target)
                  if actual_hash != match.group(1):
                      errors.append(
                          f"{label}:{number}: SHA-256 mismatch for {raw!r}: "
                          f"expected {match.group(1)}, got {actual_hash}"
                      )
              actual = actual_files(path.parent, path, label)
              if declared != actual:
                  missing = sorted(actual - declared)
                  stale = sorted(declared - actual)
                  if missing:
                      errors.append(f"{label}: unlisted files: {', '.join(missing)}")
                  if stale:
                      errors.append(f"{label}: stale paths: {', '.join(stale)}")


          manifests = sorted(stock_root.rglob("*MANIFEST.sha256"), key=lambda path: path.as_posix())
          sums_files = sorted(stock_root.rglob("SHA256SUMS"), key=lambda path: path.as_posix())
          if not manifests:
              errors.append("Signal-Lattice/Stock_Skill: no manifest files discovered")
          if not sums_files:
              errors.append("Signal-Lattice/Stock_Skill: no SHA256SUMS files discovered")
          for manifest in manifests:
              verify_control_file(manifest, manifest_line, dot_prefix=True)
          for sums in sums_files:
              verify_control_file(sums, sums_line, dot_prefix=False)

          if errors:
              print(f"FAIL: Stock Skill hash validation ({len(errors)} error(s))")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)
          print(
              f"PASS: {len(manifests)} manifest(s) and {len(sums_files)} SHA256SUMS file(s)"
          )
          PY

      - name: Scan public surfaces and ZIP payloads for private material
        run: python3 -B Signal-Lattice/Stock_Skill/scripts/validate_public_safety.py
