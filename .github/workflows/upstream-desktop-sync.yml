name: Watch official Kimi and DSH desktop releases

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-desktop-sync
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report source versions that require a unified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kimi_tag="$(gh api repos/MoonshotAI/kimi-code/releases/latest --jq .tag_name)"
          dsh_tag="$(gh api repos/anywhere-labs/deepseek-harness-desktop/releases/latest --jq .tag_name)"
          source_kimi="$(node -p "require('./Kimi-Code-Desktop/package.json').version")"
          source_dsh="$(node -p "require('./desktop-suite/COMPATIBILITY_CONTRACT.json').applications.dshDesktop.version")"
          {
            echo "## Desktop upstream watch"
            echo
            echo "| App | Source version | Official version |"
            echo "|---|---:|---:|"
            echo "| Kimi Code Desktop | $source_kimi | ${kimi_tag##*@} |"
            echo "| DSH Desktop | $source_dsh | ${dsh_tag#v} |"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ "$kimi_tag" != "@moonshot-ai/kimi-code@$source_kimi" ]; then
            echo "::error title=Kimi Code upstream changed::Create one source-update PR, then publish the three-app suite from that merged commit."
            status=1
          fi
          if [ "$dsh_tag" != "v$source_dsh" ]; then
            echo "::error title=DSH Desktop upstream changed::Create one source-update PR, then publish the three-app suite from that merged commit."
            status=1
          fi
          exit "$status"
