name: Harness UI signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already present in Harness-UI/package.json"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean
      confirm:
        description: "Type RELEASE_SIGNED_HARNESS_UI"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: harness-ui-signed-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.values.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce main, version and explicit confirmation
        id: values
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "RELEASE_SIGNED_HARNESS_UI"
          test "$(node -p "require('./Harness-UI/package.json').version")" = "$VERSION"
          printf 'tag=harness-ui-v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: guard
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require Developer ID and notarization credentials
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-harness-ui
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/harness-ui.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Test, sign, notarize and package arm64 app
        run: |
          swift test --package-path Harness-UI/macos
          APP_VERSION="$VERSION" Harness-UI/macos/scripts/build-app.sh
          app="Harness-UI/dist/macos-arm64/Harness UI.app"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          upload="$RUNNER_TEMP/Harness-UI-notary.zip"
          ditto -c -k --keepParent "$app" "$upload"
          xcrun notarytool submit "$upload" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

          zip="Harness-UI/dist/Harness-UI-$VERSION-mac-arm64.zip"
          dmg="Harness-UI/dist/Harness-UI-$VERSION-mac-arm64.dmg"
          ditto -c -k --keepParent "$app" "$zip"
          hdiutil create -volname "Harness UI" -srcfolder "$app" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-harness-macos
          path: |
            Harness-UI/dist/Harness-UI-*-mac-arm64.dmg
            Harness-UI/dist/Harness-UI-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Require Windows code-signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD are required"
          }
      - name: Test, sign and package x64 and arm64 apps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test Harness-UI/windows/tests/HarnessUI.Windows.Tests.csproj -c Release
          $pfx = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found" }

          foreach ($arch in @("x64", "arm64")) {
            $rid = "win-$arch"
            $publish = "Harness-UI/dist/windows-$arch"
            dotnet publish Harness-UI/windows/HarnessUI.Windows.csproj -c Release -r $rid --self-contained true -o $publish
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD "$publish/HarnessUI.exe"
            & $signTool.FullName verify /pa /v "$publish/HarnessUI.exe"
            Compress-Archive -Path "$publish/*" -DestinationPath "Harness-UI/dist/Harness-UI-$env:VERSION-windows-$arch.zip" -Force
            & $iscc "/DAppArch=$arch" "/DSourceDir=$((Resolve-Path $publish).Path)" "Harness-UI/windows/installer.iss"
            $installer = "Harness-UI/dist/Harness-UI-$env:VERSION-windows-$arch-setup.exe"
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer
            & $signTool.FullName verify /pa /v $installer
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-harness-windows
          path: |
            Harness-UI/dist/Harness-UI-*-windows-*.exe
            Harness-UI/dist/Harness-UI-*-windows-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-harness-*
          path: release-assets
          merge-multiple: true
      - name: Add standalone DSH adapter bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd Harness-UI
          zip -r "../release-assets/Harness-UI-$VERSION-DSH-adapter.zip" dsh-plugin scripts/install-dsh.mjs LICENSE README.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -ge 7
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Harness UI v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${assets[@]}" "${args[@]}"
