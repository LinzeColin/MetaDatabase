name: ABD continuous validation

on:
  push:
    branches: [main, "codex/abd-**"]
    paths:
      - "ABD/**"
      - ".github/workflows/abd-stage0-validation.yml"
      - ".github/workflows/dual-plane.yml"
  pull_request:
    paths:
      - "ABD/**"
      - ".github/workflows/abd-stage0-validation.yml"
      - ".github/workflows/dual-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abd-stage0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ABD
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: 安装冻结开发依赖
        run: uv sync --frozen --group dev
      - name: 验证人类平面可确定性重生
        run: |
          uv run --frozen --python 3.12 python machine/tools/render_human.py
          git diff --exit-code -- 文档
      - name: 验证 A$0 依赖与任务包合同
        run: |
          uv run --frozen --python 3.12 python machine/tools/scan_paid_dependencies.py
          uv run --frozen --python 3.12 python machine/tools/validate_pack.py
      - name: 运行 ABD 全回归
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            uv run --frozen --python 3.12 python -m pytest -q
            exit 0
          fi
          base_sha="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -q '^ABD/'; then
            uv run --frozen --python 3.12 python -m pytest -q
          else
            echo "No ABD source change: run the failure-closed workflow regression; Dual-Plane Governance validates project classification."
            uv run --frozen --python 3.12 python -m pytest -q \
              tests/S00/stage_review_test.py::test_abd_ci_workflow_mutations_fail_closed
          fi
      - name: 验证已交付 Stage 0 的不可变收据
        run: >-
          uv run --frozen --python 3.12 python -m abd_acceptance
          --verify-existing STAGE-REVIEW-S00
      - name: 重建清单并验证全部 SHA-256
        run: |
          uv run --frozen --python 3.12 python machine/tools/update_artifact_manifest.py
          shasum -a 256 -c machine/evidence/SHA256SUMS
      - name: 验证工作流重放无仓库漂移
        run: git diff --exit-code
