[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "global-equity-lead-lag-atlas"
version = "0.0.0.1"
description = "Embeddable, session-aware global equity correlation and lead-lag analysis skill"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LinzeColin"}]
dependencies = []

[project.scripts]
gela = "gela.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
