schema: "signal-lattice-evidence-card/1"
id: "critical-minerals-antimony-rare-earths"
bottleneck: "关键矿产（锑与稀土）：美国净进口依赖锑 91%、稀土化合物与金属 71% 来自中国；中国 2024-2025 年对锑和稀土出口的管制让价格与供应出现剧烈波动，国内新矿刚开工。"
retrieved: "2026-09-30"
valid_until: "2027-09-30"
factors:
  funded_demand:
    rating: 2
    valid_until: "2027-03-31"
    basis: "USGS 记载美国国防部（文中称 Department of War）有条件授予一家爱达荷锑矿 8000 万美元资金，用于重建国内锑来源；这是政府对供给侧的出资，不是终端采购合同，也只有一条来源，所以 2 分。"
    sources:
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-antimony.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Antimony"
        excerpt: "The company was conditionally awarded $80 million of funding from the U.S. Department of War to reestablish a domestic source of antimony."
  current_tightness:
    rating: 3
    valid_until: "2027-03-31"
    basis: "USGS：2025 年锑均价每磅 25 美元，是 2024 年的两倍多，中国 2024-12 起禁止向美国出口锑；但价格在 2025-06 达到 27.5 美元后回落到 11 月的 20.3 美元，所以给 3 而不是 4。"
    sources:
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-antimony.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Antimony"
        excerpt: "The average antimony price in 2025 was $25 per pound, more than double of that in 2024. In 2024, the average monthly antimony price nearly doubled from $9.8 per pound in August to $18.10 per pound in December after China announced export restrictions on antimony in August and then banned all exports of antimony to the United States in December."
  supplier_concentration:
    rating: 4
    basis: "USGS 2021-2024 年进口来源：锑金属与氧化物合计 55% 来自中国，稀土化合物与金属 71% 来自中国；锑净进口依赖度估计 2025 年为 91%。数字直接、来自政府统计，但只有 USGS 一个发布方，所以不给 5。"
    sources:
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-antimony.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Antimony"
        excerpt: "Total metal and oxide: China, 55%; Belgium, 12%; Thailand, 8%; India, 6%; and other, 19%."
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-rare-earths.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Rare Earths"
        excerpt: "Rare-earth compounds and metals: China,8 71%; Malaysia, 13%; Japan, 5%; Estonia, 5%; and other, 6%."
  substitution_difficulty:
    rating: 2
    basis: "USGS 稀土章节称许多用途有替代品但效果通常较差；锑章节也列出多种阻燃剂等替代品。说明替代有一定代价但并非不可能，所以只给 2。"
    sources:
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-rare-earths.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Rare Earths"
        excerpt: "Substitutes are available for many applications but generally are less effective."
  policy_resilience:
    rating: 2
    basis: "USGS 记载中国 2025-11 暂停 10 月的出口管制 1 年，4 月的管制仍有效但开始发放通用许可；约束由政策制造，但目前处于部分放松状态，所以只给 2。"
    sources:
      - url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-rare-earths.pdf"
        kind: "government_statistics"
        publisher: "U.S. Geological Survey"
        title: "Mineral Commodity Summaries 2026: Rare Earths"
        excerpt: "In November, China suspended the October export controls for 1 year. The April export controls remained in effect, although China began to issue general export licenses to selected exporters."
