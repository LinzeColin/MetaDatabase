contradictions:
  - searched: "USGS 锑章节里价格是否已经回落、国内是否已有新增供给。"
    found: "价格 2025-06 达到每磅 27.5 美元后，11 月回落到 20.3 美元；2025 年蒙大拿一家公司已开始采锑，爱达荷另一家刚动工。"
    effect: "current_tightness 从 4 降为 3；国内新增供给尚未达到规模，不影响 supplier_concentration。"
  - searched: "USGS 稀土章节里美国国内是否有稀土开采与加工。"
    found: "2025 年国内在加州 Mountain Pass 等地开采稀土，精矿产量估计 5.1 万吨氧化物当量；稀土精矿是净出口，瓶颈集中在化合物与金属的分离加工环节。"
    effect: "本卡的稀土部分只针对化合物与金属，不针对精矿；没有给稀土单独评分，仅在 supplier_concentration 里引用化合物与金属的进口来源。"
  - searched: "中国出口管制是否在 2025 年底前放松。"
    found: "USGS 记载 2025-11 中国暂停 10 月扩大的管制 1 年，4 月的管制仍然有效但开始发通用许可。"
    effect: "policy_resilience 只给 2。"
