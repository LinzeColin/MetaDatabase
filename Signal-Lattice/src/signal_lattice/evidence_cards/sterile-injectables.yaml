contradictions:
  - searched: "GAO-25-107110 里活跃短缺的数量是否在下降。"
    found: "GAO 引用 FDA 数据：活跃短缺在 2019 年约 109 项、2021 年 115 项、2024 年 102 项，2024 年并未继续恶化。"
    effect: "current_tightness 只给 2。"
  - searched: "ASPE 报告对短缺原因的判断：是产能不足还是经济激励不足。"
    found: "ASPE 认为低预期利润导致市场偏薄、缺乏抗风险能力；这更像经济激励问题而不是物理产能的绝对上限，未找到官方对无菌灌装产能总量的数字。"
    effect: "本卡没有给 expansion_lead_time、qualification_barrier 评分；只写有证据的两个因子。"
  - searched: "在 ANIP 最新 10-K 中核对其注射剂是否自产。"
    found: "10-K 称其注射剂由第三方生产、部分为单一来源，说明该公司不是主要的无菌注射剂制造方。"
    effect: "exposure 里如实写为「参与者」，不把它当作供给方。"
