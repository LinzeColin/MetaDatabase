schema: "signal-lattice-evidence-card/1"
id: "sterile-injectables"
bottleneck: "无菌注射剂：美国药品短缺里注射剂占一半，且持续时间约为口服药的两倍；通用名注射剂利润薄、每个分子的厂家更少，市场偏「薄」，抗风险能力弱。"
retrieved: "2026-09-30"
valid_until: "2027-09-30"
factors:
  current_tightness:
    rating: 2
    valid_until: "2027-03-31"
    basis: "HHS/ASPE 数据简报（2025-01，数据到 2023 年）显示注射剂短缺持续时间中位数 4.6 年、约为口服药的 3 倍（口服 1.6 年）；GAO 2024 年报告确认短缺最常见于医院和肿瘤治疗用的无菌注射剂。两者都已超过 18 个月，而 GAO 统计的活跃短缺数 2021 年 115 项、2024 年 102 项，没有继续恶化的证据，所以 2 分。"
    sources:
      - url: "https://aspe.hhs.gov/sites/default/files/documents/efa332939da2064fa2c132bb8e842bb5/Drug%20Shortages_Data%20Brief_Final_2025.01.10.pdf"
        kind: "regulator"
        publisher: "HHS Office of the Assistant Secretary for Planning and Evaluation"
        title: "Drug Shortages Data Brief (2025-01)"
        excerpt: "Using the data from 2018 to 2023, we find that drug shortages last roughly twice as long for injectable products (median = 4.6 years) as for oral products (median = 1.6 years) or topical products (median = 2.2 years)."
      - url: "https://www.gao.gov/assets/gao-25-107110.pdf"
        kind: "government_statistics"
        publisher: "U.S. Government Accountability Office"
        title: "GAO-25-107110 Drug Shortages: HHS Should Implement a Mechanism to Coordinate its Activities"
        excerpt: "For example, shortages most commonly affect sterile injectable drugs that are critical to hospital care and cancer treatment."
  supplier_concentration:
    rating: 2
    basis: "ASPE 报告称通用名注射剂每个分子的厂家数比通用名口服药更少，并指出 70% 的新上市通用名注射剂三年内不盈利；这说明市场偏薄，但没有给出具体的厂家数量或份额，所以只给 2。"
    sources:
      - url: "https://aspe.hhs.gov/reports/roi-generic-injectable-prescription-drugs"
        kind: "regulator"
        publisher: "HHS Office of the Assistant Secretary for Planning and Evaluation"
        title: "An Examination of the Return on Investment of Generic Injectable Prescription Drugs"
        excerpt: "The generic injectable market is also composed of fewer manufacturers per molecule than the generic oral market."
