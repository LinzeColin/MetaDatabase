schema: "signal-lattice-evidence-card/1"
id: "nuclear-fuel-cycle"
bottleneck: "核燃料循环：美国电厂的天然铀与浓缩服务绝大部分依赖进口（浓缩服务中俄罗斯来源占 26%），俄罗斯低浓铀进口被立法禁止但豁免最晚 2028-01-01 到期，新矿从决策到投产常需 10 年以上。"
retrieved: "2026-09-30"
valid_until: "2027-09-30"
factors:
  funded_demand:
    rating: 3
    valid_until: "2027-03-31"
    basis: "EIA 年度统计显示美国电厂已签合同的 2026-2035 年铀交付量为 1.74 亿磅 U3O8e，另有 1.86 亿磅尚未签约；需求有合同锁定但只覆盖约一半，且不含价格承诺，因此只给 3。"
    sources:
      - url: "https://www.eia.gov/uranium/marketing/pdf/umar.pdf"
        kind: "government_statistics"
        publisher: "U.S. Energy Information Administration"
        title: "Uranium Marketing Annual Report (2025 data)"
        excerpt: "deliveries for 2026 through 2035 under existing purchase contracts for COOs totaled 174 million pounds U3O8e (Table 10). Also at the end of 2025, unfilled uranium market requirements for 2025 through 2035 totaled 186 million pounds U3O8e (Table 11)."
  current_tightness:
    rating: 3
    valid_until: "2027-03-31"
    basis: "EIA 2025 年数据：浓缩服务（SWU）均价同比上涨 11%，为近一年的官方数字；但这是价格信号而非短缺清单或交期，且只覆盖美国电厂采购，故 3 分。"
    sources:
      - url: "https://www.eia.gov/uranium/marketing/pdf/umar.pdf"
        kind: "government_statistics"
        publisher: "U.S. Energy Information Administration"
        title: "Uranium Marketing Annual Report (2025 data)"
        excerpt: "The average price paid by the COOs for the 13 million SWU was $108.70 per SWU in 2025, up 11% from the $97.66 per SWU paid in 2024."
  supplier_concentration:
    rating: 4
    basis: "EIA 2025 年数据：美国电厂浓缩服务 77% 来自国外、单一国家俄罗斯占 26%；铀原料交付中美国本土只占 7%。数字直接、来自政府统计，只有 EIA 一个发布方，所以不给 5。"
    sources:
      - url: "https://www.eia.gov/uranium/marketing/pdf/umar.pdf"
        kind: "government_statistics"
        publisher: "U.S. Energy Information Administration"
        title: "Uranium Marketing Annual Report (2025 data)"
        excerpt: "In 2025, the U.S.-origin SWU share was 23%, and the foreign-origin SWU accounted for the remaining 77%. Foreign-origin SWU included 26% from Russia, 18% from France, 14% from the United Kingdom, and 8% from the Netherlands (Table 16)."
      - url: "https://www.eia.gov/uranium/marketing/pdf/umar.pdf"
        kind: "government_statistics"
        publisher: "U.S. Energy Information Administration"
        title: "Uranium Marketing Annual Report (2025 data)"
        excerpt: "U.S. material accounted for 7% of total deliveries in 2025, down from 8% in 2024 (Table 3)."
  expansion_lead_time:
    rating: 2
    basis: "只有一条来源：UEC 10-K 称许多新矿项目需 10-20 年。这是矿企自述（有利益相关），没有政府或第三方数字佐证，所以只给 2。"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/1334933/000143774926031414/uec20260731_10k.htm"
        kind: "company_filing"
        publisher: "U.S. SEC (company filing)"
        title: "Uranium Energy Corp Form 10-K FY2026"
        excerpt: "The timeline for many new mining projects can be 10 to 20 years and they are expected to require prices high enough to stimulate new mining investments."
  policy_resilience:
    rating: 3
    basis: "《禁止俄罗斯铀进口法》(Public Law 118-62) 以法律形式限制俄罗斯低浓铀进口，但允许能源部豁免，豁免最晚 2028-01-01 终止；政策在维持稀缺，但豁免条款意味着并非永久，故 3 分。"
    sources:
      - url: "https://www.govinfo.gov/content/pkg/PLAW-118publ62/pdf/PLAW-118publ62.pdf"
        kind: "regulator"
        publisher: "U.S. Government Publishing Office (Public Law 118-62)"
        title: "Prohibiting Russian Uranium Imports Act"
        excerpt: "Any waiver issued under subparagraph (A) shall terminate not later than January 1, 2028."
