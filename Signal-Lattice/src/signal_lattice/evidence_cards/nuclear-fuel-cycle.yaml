contradictions:
  - searched: "在 EIA《Uranium Marketing Annual Report》2025 年数据里找供给放松的迹象：美国本土铀占交付比例是否上升、是否有大量未签约需求已被满足。"
    found: "美国本土铀占 2025 年交付的 7%，低于 2024 年的 8%；2025 年底仍有 1.86 亿磅 2025-2035 年需求未签约。没有发现供给放松的官方数字。"
    effect: "无，评分不变；但这些数字只反映美国电厂采购，不代表全球。"
  - searched: "在 Energy Fuels 最新 10-K 里找矿山因市场价格而停产或待命的记录（说明供给对价格有弹性）。"
    found: "10-K 写明其在美国的传统铀矿资产随市场条件变化时而生产、时而待命；说明只要价格合适，现有矿山能较快复产。"
    effect: "这削弱了「供给长期刚性」的论断，因此没有给 expansion_lead_time 超过 2 分，也没有给 current_tightness 超过 3 分。"
  - searched: "查 Terrestrial Energy (IMSR) 最新 10-K 对高丰度低浓铀 (HALEU) 供应的说法，判断燃料瓶颈是否对所有反应堆路线都成立。"
    found: "该公司 10-K 明确称其刻意避开 HALEU，使用更易获得的 SALEU；因此燃料瓶颈对不同反应堆路线影响不同。"
    effect: "因此本卡没有登记 IMSR，也没有给 architectural_necessity 评分。"
