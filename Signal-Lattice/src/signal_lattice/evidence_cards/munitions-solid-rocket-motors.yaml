  - searched: "国防部是否在扩大产能，国防部 2025-09 的公告是否显示新增产能。"
    found: "战争部 2025-09-26 公告两笔共 3350 万美元的第三章奖励，受奖方为 Americarb 与 General Dynamics OTS，用于扩大固体火箭发动机工业基础，说明新增产能正在资助中。"
    effect: "funded_demand 给 3；同时说明瓶颈正在被缓解，没有给 current_tightness 与 expansion_lead_time 评分。"
