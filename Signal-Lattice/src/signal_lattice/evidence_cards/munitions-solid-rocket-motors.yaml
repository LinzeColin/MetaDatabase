schema: "signal-lattice-evidence-card/1"
id: "munitions-solid-rocket-motors"
bottleneck: "弹药与导弹动力工业基础：固体火箭发动机制造商从 1995 年的六家合并为两家，下游分供应商二十年间从约 5000 家降到约 1000 家；国防部近年用《国防生产法》第三章等资金扩产。"
retrieved: "2026-09-30"
valid_until: "2027-09-30"
factors:
  funded_demand:
    rating: 3
    valid_until: "2027-03-31"
    basis: "国防部（现称战争部）2025-09 宣布两笔《国防生产法》第三章奖励共 3350 万美元用于扩大固体火箭发动机工业基础；GAO 统计国防部 2020-2024 财年在 828 个工业基础项目上承诺约 65 亿美元。这是政府对供给侧的真金白银，但不是订单合同，也无法从中拆出弹药部分，所以 3 分。"
    sources:
      - url: "https://www.war.gov/News/Releases/Release/Article/4316035/department-of-war-awards-335-million-to-increase-solid-rocket-motor-capacity-an/"
        kind: "regulator"
        publisher: "U.S. Department of War"
        title: "Department of War Awards $33.5 Million to Increase Solid Rocket Motor Capacity and Capability"
        excerpt: "Today, the Department of War announced two Defense Production Act (DPA) Title III awards totaling $33.5 million to expand the solid rocket motor (SRM) industrial base."
      - url: "https://www.gao.gov/assets/gao-25-107283.pdf"
        kind: "government_statistics"
        publisher: "U.S. Government Accountability Office"
        title: "GAO-25-107283 Defense Industrial Base: Actions Needed to Address Risks Posed by Dependence on Foreign Suppliers"
        excerpt: "Together, DOD obligated about $6.5 billion for 828 projects from fiscal years 2020 through 2024."
  supplier_concentration:
    rating: 3
    basis: "GAO-18-45 记载固体火箭发动机下游有一家制造商估计其供应商从约 5000 家降到约 1000 家，单一来源部件风险上升。数字直接，但报告是 2017 年的，且之后有新进入者（见反证），所以最多 3 分。"
    sources:
      - url: "https://www.gao.gov/assets/gao-18-45.pdf"
        kind: "government_statistics"
        publisher: "U.S. Government Accountability Office"
        title: "GAO-18-45 Solid Rocket Motors: DOD and Industry Are Addressing Challenges to Minimize Supply Concerns"
        excerpt: "For example, one SRM manufacturer estimated a decrease in suppliers, from approximately 5,000 to 1,000, over the last 20 years."
