[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lattice"
version = "0.0.0.1.41"
description = "每分钟运行全部独立股票 Skill 并输出唯一投资建议的零 Agent 决策中枢"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signal-lattice = "signal_lattice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lattice = ["schema.sql"]
