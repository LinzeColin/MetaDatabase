[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lattice"
version = "0.0.0.1.40"
description = "确定性、零 Agent、零模型 Token 的股票信号格阵决策系统"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signal-lattice = "signal_lattice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lattice = ["schema.sql"]
