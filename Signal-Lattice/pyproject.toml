[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lattice"
version = "0.0.0.2.7"
description = "基于免费免密钥真实市场数据的只读多分支投资研究系统"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signal-lattice = "signal_lattice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lattice = ["schema.sql"]
