# FIFA 日报静态服务：只读挂载 /var/lib/fifa-daily 为 /data，对外只暴露 /data/current（= 当前发布的站点）下的文件。
# Traefik 把 home.linzezhang.com/fifa 转进来（不剥前缀），所以这里也按 /fifa/ 前缀提供，页面里全是相对链接，前缀下直接能用。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  access_log off;
  server_tokens off;
  sendfile on;
  absolute_redirect off;          # 跳转只给路径，不带容器内的 http://host:8080，避免掉出 https
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  server {
    listen 8080 default_server;
    server_name _;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /fifa { return 301 /fifa/; }
    # 状态与账本在站点目录的 data/ 里，属于内部文件，不对外
    location ^~ /fifa/data/ { return 404; }
    location /fifa/ {
      alias /data/current/;
      index index.html;
      add_header Cache-Control "no-cache" always;   # 每次向服务器确认（ETag），不让浏览器/中间层长期缓存旧报告
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex" always;
    }
    location / { return 404; }
  }
}
