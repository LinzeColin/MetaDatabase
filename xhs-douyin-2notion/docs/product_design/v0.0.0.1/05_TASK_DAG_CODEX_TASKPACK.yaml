- id: TSK.x2n.uxops.005
  title: Implement durable Private-MetaDatabase lifecycle, export, retention, tombstone and governed deletion controls
  stage: STG.X2N.5
  phase: PH.X2N.5.5
  status: complete_ci_synth
  owner: codex
  authorization: owner_starts_codex_dev
  human_input: physical local deletion and whole-root Time Machine exclusion each require explicit Owner confirmation at runtime; development uses synthetic data
  objective: Give the owner explicit, previewable and auditable control over active private runtime data while making Private-MetaDatabase the only durable destination, retaining SQLite as logical canonical truth, and never misrepresenting local deletion as erasure of immutable durable history.
  inputs:
  - canonical DB
  - library
  - backup
  - relation state
  - KMOS/KMDatabase/machine/tools/private_db_client.py
  - Private-MetaDatabase area with domain xhs-douyin-2notion
  - client redlines for raw .sqlite/.db files and objects larger than 95 MiB
  - Owner-authorized existing gh authenticated session used only through private_db_client.py with no Token value read/export/display and no auth/config/helper mutation
  outputs:
  - canonical JSONL export
  - consistent SQLite snapshot packaged as a non-running archival bundle
  - content-addressed archive chunks no larger than 90 MiB
  - project restore manifest bound to Private-MetaDatabase domain xhs-douyin-2notion
  - monotonic deletion_epoch and logical tombstone set in the latest project restore manifest
  - ingest/get/list/verify durability receipts
  - project-domain manifest filter and end-to-end restore verification
  - domain-bound chunk envelope with opaque names and payload hashes
  - verified cleanup of every temporary get output
  - durability-pending recovery state
  - pre-state receipt, explicit Owner authorization, tmutil whole-root exclusion action and post-state verification for X2N_DATA_ROOT on macOS
  - fail-closed unsupported result on non-macOS rather than claiming an equivalent backup exclusion
  - repository-root WHERE_IS_PROJECT_DATA.md xhs-douyin-2notion row synchronized at merge
  - delete preview/confirm
  - relation tombstone
  - runtime wipe
  - TTL policies
  - active SQLite and derived-sink deletion only; durable hard erase is UNSUPPORTED_OWNER_PRIVATE_DB_GOVERNANCE_REQUIRED because x2n forbids the Private-Database delete command
  depends_on:
  - TSK.x2n.uxops.002
  - TSK.x2n.uxops.004
  acceptance_ids:
  - ACC.x2n.gov.002
  - ACC.x2n.media.002
  - ACC.x2n.ops.003
  - ACC.x2n.data.004
  tests:
  - export round-trip
  - cancel delete
  - relation-vs-content deletion
  - backup/restore
  - Private-MetaDatabase ingest/get/list/verify without clone
  - raw .sqlite/.db and oversized object redline rejection
  - archive chunk hash/reassembly and restored SQLite integrity
  - global manifest domain filtering rejects cross-project records
  - same-payload cross-domain ingest cannot suppress the xhs-douyin-2notion manifest record
  - area-global verify output is redacted advisory only; exact-domain manifest rows plus per-object get/hash/reassembly/integrity are the x2n durability Gate
  - a missing x2n-domain object fails closed even when area-global verify exits zero
  - a missing other-domain object neither blocks x2n durability nor appears by path/name in x2n logs or evidence
  - put/delete command rejection plus attestation that only private_db_client.py used the Owner-authorized authenticated session without Token value contact or auth mutation
  - opaque object names and temporary get cleanup
  - local working-copy loss and durability-pending recovery
  - Owner-confirmed tmutil addexclusion targets the whole X2N_DATA_ROOT, snapshots pre-state and verifies the root and every required subpath are excluded; local backup still cannot satisfy durability
  - restore rejects an older deletion_epoch and applies the latest tombstones so a retained historical snapshot cannot resurrect logically deleted content
  - local wipe and sink deletion cannot be reported as durable hard erase
  - TTL
  evidence:
  - evidence/lifecycle/TSK.x2n.uxops.005.json
  risks:
  - unintended physical deletion
  - backup includes cookies
  - Notion reverse deletion
  - local SQLite is reported durable before a verified receipt
  - Private-Database is cloned or written outside the approved client
  - raw running SQLite is renamed to bypass the client redline
  - an archive exceeds the client object limit or cannot be reassembled
  - the authenticated session is used outside private_db_client.py, a Token value enters process input/logs/evidence, or auth/config/Credential Helper is mutated
  - global manifest SHA-only idempotency loses the project domain record
  - client verify output reports missing objects but wrapper treats exit zero as success
  - area-global verify leaks or couples another project state into the x2n durability decision
  - an OS backup silently creates a second durable destination
  - retained durable history resurrects content deleted from the active canonical state
  rollback:
  - physical_delete flag off; keep the whole-root Time Machine exclusion as the safer state; any explicit backup-policy rollback requires a separate Owner action and receipt; restore only a manifest at the latest deletion_epoch
  stop_conditions:
  - delete effect cannot be previewed or rolled back
  - backup would include secrets/browser profiles
  - durable data requires cloning Private-Database or bypassing private_db_client.py
  - a canonical commit can be reported durable without a verified receipt
  - project restore selects a manifest record outside domain xhs-douyin-2notion
  - any object name contains title, content ID, account identity or source URL
  - any get output remains after hash/reassembly/restore
  - the Task would require reading/exporting/displaying a Token value or modifying/deleting/rotating/revoking authentication
  - Owner has not explicitly authorized whole-root Time Machine exclusion, tmutil verification fails, any X2N_DATA_ROOT subpath remains included, or the OS is unsupported
  - restore can select an older deletion_epoch or omit a current logical tombstone
  - local deletion is described as durable hard erase without separate Owner Private-Database governance
  - WHERE_IS_PROJECT_DATA.md cannot be synchronized without overlapping another project row
  allowed_parent_paths:
  - WHERE_IS_PROJECT_DATA.md:xhs-douyin-2notion-row-only
  effort_hours:
    low: 6
    likely: 12
    high: 25
  completion_gate: all outputs exist; declared tests pass; evidence receipts emitted; no stop condition active
