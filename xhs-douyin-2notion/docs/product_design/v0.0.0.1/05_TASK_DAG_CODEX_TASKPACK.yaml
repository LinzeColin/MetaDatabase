- id: TSK.x2n.adapters.010
  title: Wire capability-scoped Native dispatch and explicit current-page fallback
  stage: STG.X2N.3
  phase: PH.X2N.3.10
  status: completed
  owner: codex
  authorization: owner_starts_codex_dev
  human_input: none; development uses synthetic fixtures and performs zero real platform calls
  objective: Make all eight relation/list scopes executable through strict Extension-to-Native-to-Adapter dispatch while preserving fail-closed external gates and requiring a second explicit Owner action for current-page fallback.
  inputs:
  - eight completed relation/list adapter contracts
  - Native Messaging contract
  - canonical request/job state
  - platform capability and feature-flag policies
  - current StartSyncPayload rejects saved_current even though bilibili_selected_collection, kuaishou_selected_collection and taobao_selected_collection require that exact relation semantic
  - current GET_CAPABILITIES response has no typed result or capability-manifest payload
  - current Native response invariant: accepted responses have no error and rejected responses use status=rejected
  - current SQLite run_record state includes failed but has no FALLBACK_AVAILABLE state
  outputs:
  - eight-scope dispatch allowlist and router
  - versioned START_SYNC discriminated request with a strict scope_id enum bound to the exact platform and relation matrix
  - saved_current allowed in START_SYNC only for bilibili_selected_collection, kuaishou_selected_collection and taobao_selected_collection, each bound to an Owner-selected manifest, source identity and max_items; CAPTURE_CURRENT remains a distinct single-item saved_current action
  - versioned discriminated GET_CAPABILITIES result carrying exactly eight typed scope outcomes with terminal, fine-grained reason_code, source registry digests and feature flag
  - versioned SQLite capability_gate_outcome table with at most one derived runtime row per scope_id and exactly eight rows only for a valid complete evaluation; columns are terminal, reason_code, source_registry_digests, evidence_hash and evaluated_at
  - BLOCKED_TECHNICAL is a global veto evaluated before every external reason; it prevents a complete eight-row snapshot, invalidates/removes the affected current row and makes GET_CAPABILITIES fail closed so a stale digest/READY row cannot be served; only after technical=false does deterministic precedence UNKNOWN_DISABLED > BLOCKED_POLICY > BLOCKED_AUTH > BLOCKED_BUDGET > BLOCKED_CAPABILITY > CI_SYNTH_READY apply
  - existing capability/policy/feature registries retained only as versioned inputs while capability_gate_outcome is the authoritative restart-safe derived runtime snapshot
  - versioned SQLite migration with run_failure rows bound to run_record.state=failed, stable sanitized error code, fallback_eligible and provenance hash
  - FALLBACK_AVAILABLE as a deterministic Side Panel affordance derived from failed run plus fallback_eligible row, never as a second run_record state
  - rejected GET_JOB failure envelope that preserves job_id and uses stable X2N_ADAPTER_FAILED_FALLBACK_AVAILABLE plus next_action=capture_current while retaining the accepted-response error invariant
  - optional fallback_from_job_id on CAPTURE_CURRENT and a second-owner-action current-page request flow with a new request_id
  - synchronized Pydantic model, error registry, generated JSON Schema/TypeScript contract and Extension consumer
  - migration up/down and pre-task Native request/response compatibility evidence
  - restart-safe Side Panel status
  depends_on:
  - TSK.x2n.adapters.005
  - TSK.x2n.foundation.004
  - TSK.x2n.skeleton.004
  acceptance_ids:
  - ACC.x2n.batch.002
  - ACC.x2n.ext.003
  - ACC.x2n.batch.001
  tests:
  - eight-scope Extension-to-Native-to-Adapter dispatch E2E
  - exact eight-row platform/relation/scope matrix plus rejection of every invalid cross-product, unknown scope and duplicate scope
  - the three selected-collection saved_current START_SYNC scopes require Owner-selected manifest, source identity and max_items; every other START_SYNC saved_current combination is rejected
  - CAPTURE_CURRENT remains single-item saved_current and cannot be confused with a selected-collection sync request
  - GET_CAPABILITIES round-trip returns exactly eight typed outcomes; unknown fields, duplicate/missing scopes, stale source digests and disabled-support overclaims are rejected
  - capability reason precedence, restart recovery, registry-digest change and conflict tests prove at most one row per scope and exactly eight only for a valid complete authoritative snapshot
  - BLOCKED_TECHNICAL cannot be serialized as DISABLED_EXTERNAL_GATE and keeps Task010/G3 blocked
  - BLOCKED_TECHNICAL combined with each external reason still yields no terminal, invalidates any stale READY row and keeps G3 blocked
  - unknown action and disabled external gate rejection
  - duplicate request and worker/companion restart recovery
  - adapter failure atomically writes run_record failed plus one sanitized run_failure row
  - GET_JOB preserves failed job_id and deterministically derives FALLBACK_AVAILABLE after process restart
  - accepted response plus error remains invalid and no new Native status enum is invented
  - second explicit Owner action creates a separate current-page request with fallback_from_job_id provenance
  - migration up/down plus old current-page and job-response compatibility vectors
  - old health/current-page/native response vectors remain compatible while the versioned START_SYNC and GET_CAPABILITIES shapes are additive and discriminated
  - generated JSON Schema/TypeScript drift check
  - automatic fallback and real platform calls remain zero
  evidence:
  - evidence/adapters/TSK.x2n.adapters.010.json
  risks:
  - broad dispatch permits an unregistered action
  - the current START_SYNC relation enum makes three selected-collection scopes unrepresentable or mislabels them
  - GET_CAPABILITIES cannot transport the persisted scope outcome to the Side Panel
  - policy registries and SQLite become competing runtime truths
  - fallback silently performs a second side effect
  - disabled capability is misrepresented as supported
  - UI and SQLite job state diverge after restart
  - Native response compatibility is broken or a failed job loses its job_id/error provenance
  rollback:
  - disable all relation/list dispatch flags and preserve independently tested current-page capture
  stop_conditions:
  - any unknown action reaches an adapter
  - any platform/relation/scope cross-product outside the exact eight-row matrix is accepted
  - any of the three selected-collection scopes is coerced to liked/favorited or loses Owner manifest/source/max_items binding
  - GET_CAPABILITIES cannot round-trip all eight typed outcomes after restart
  - multiple capability runtime authorities exist or reason precedence is nondeterministic
  - BLOCKED_TECHNICAL produces either legal terminal or permits G3/Stage 3 upload
  - any external reason masks a simultaneous technical veto or a stale READY row remains serviceable
  - any fallback runs without a second explicit Owner action
  - any disabled capability performs a platform call or is declared supported
  - restart cannot reconcile Side Panel state from SQLite
  - FALLBACK_AVAILABLE is persisted as a competing run state or inferred without a fallback_eligible failure row
  - accepted response carries an error, rejected failed-job response loses job_id, or pre-task contract vectors break
  effort_hours:
    low: 10
    likely: 18
    high: 35
  completion_gate: all outputs exist; declared tests pass; evidence receipts emitted; no stop condition active
