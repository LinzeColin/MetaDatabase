name: ${COMPOSE_PROJECT_NAME:-jobhuntbot-online}

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhunt
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - jobhunt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]

  web:
    image: ${APP_IMAGE:-jobhuntbot-online:0.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jobhunt_uploads:/data/uploads
      - jobhunt_backups:/data/backups
    expose: ["8000"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${EDGE_NETWORK:-coolify}"
      traefik.http.routers.jobhuntbot-http.entrypoints: "http"
      traefik.http.routers.jobhuntbot-http.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.jobhuntbot-http.middlewares: "jobhuntbot-https"
      traefik.http.routers.jobhuntbot-http.service: "jobhuntbot"
      traefik.http.routers.jobhuntbot-http.priority: "100"
      traefik.http.routers.jobhuntbot.entrypoints: "https"
      traefik.http.routers.jobhuntbot.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.jobhuntbot.tls: "true"
      traefik.http.routers.jobhuntbot.tls.certresolver: "letsencrypt"
      traefik.http.routers.jobhuntbot.priority: "100"
      traefik.http.services.jobhuntbot.loadbalancer.server.port: "8000"
      traefik.http.middlewares.jobhuntbot-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.jobhuntbot-https.redirectscheme.permanent: "true"
    networks: [internal, edge]

  scheduler:
    image: ${APP_IMAGE:-jobhuntbot-online:0.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jobhunt_uploads:/data/uploads
      - jobhunt_backups:/data/backups
    networks: [internal]

  worker:
    image: ${APP_IMAGE:-jobhuntbot-online:0.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jobhunt_uploads:/data/uploads
      - jobhunt_backups:/data/backups
    networks: [internal, edge]

  acceptance:
    profiles: ["acceptance"]
    image: ${ACCEPTANCE_IMAGE:-jobhuntbot-online-acceptance:0.3.0}
    build:
      context: .
      dockerfile: Dockerfile.acceptance
    env_file: .env
    volumes:
      - ./evidence:/app/evidence
    networks: [internal, edge]
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  jobhunt_postgres:
  jobhunt_uploads:
  jobhunt_backups:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  internal:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK:-coolify}
