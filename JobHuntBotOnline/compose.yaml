name: jobhuntos-online

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobhuntos-online:0.2.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/jobhuntos.db
    volumes:
      - ${DATA_PATH:-./runtime-data}:/data
    group_add:
      - "${HOST_DATA_GID:-10001}"
    expose:
      - "8000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.jobhuntos-http.entrypoints: "http"
      traefik.http.routers.jobhuntos-http.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.jobhuntos-http.middlewares: "jobhuntos-https"
      traefik.http.routers.jobhuntos-http.service: "jobhuntos"
      traefik.http.routers.jobhuntos.entrypoints: "https"
      traefik.http.routers.jobhuntos.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.jobhuntos.tls: "true"
      traefik.http.routers.jobhuntos.tls.certresolver: "letsencrypt"
      traefik.http.services.jobhuntos.loadbalancer.server.port: "8000"
      traefik.http.middlewares.jobhuntos-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.jobhuntos-https.redirectscheme.permanent: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - private
      - coolify

networks:
  private:
    driver: bridge
  coolify:
    external: true
    name: coolify
