{% extends "base.html" %}
{% block title %}设置新密码｜JobHuntBot{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>设置新密码</h1>
    <form method="post" action="/reset-password" class="form-stack" data-testid="reset-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label>新密码<input type="password" name="password" minlength="10" required data-testid="reset-password"></label>
      <label>确认新密码<input type="password" name="password_confirm" required data-testid="reset-password-confirm"></label>
      <button class="button full" type="submit" data-testid="reset-submit">保存新密码</button>
    </form>
  </div>
</section>
{% endblock %}
