{% extends "base.html" %}
{% block title %}求职偏好与专业事实｜JobHuntBot{% endblock %}
{% block content %}
<section class="settings-layout">
  <aside class="settings-nav"><h2>设置</h2><a class="active" href="/settings/profile">求职偏好</a><a href="/settings/security">账户安全</a><a href="/settings/data">数据与隐私</a></aside>
  <form method="post" action="/settings/profile" class="form-card" data-testid="settings-profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h1>求职偏好与专业事实</h1><p>修改后会重新评估推荐；自动刷新仍固定为每 6 小时一次。</p>
    <section class="preset-panel"><div><b>快速选择目标方向</b><small>可多选</small></div><div class="preset-row"><button type="button" class="preset-chip" data-action="role-preset" data-role-preset="金融分析,会计与审计,风险管理">金融</button><button type="button" class="preset-chip" data-action="role-preset" data-role-preset="法律,合规,合同与法务运营">法律</button><button type="button" class="preset-chip" data-action="role-preset" data-role-preset="数据分析,业务分析">数据与业务分析</button></div></section>
    <div class="form-grid">
      <label class="wide">目标岗位方向<input name="primary_roles" required value="{{ primary_roles_display }}" data-testid="settings-roles"></label>
      <label class="wide">目标城市或地区<input name="target_locations" required value="{{ profile.target_locations|join(', ') }}" data-testid="settings-locations"></label>
      <label>当前工作权利<input name="work_authorization" required value="{{ profile.work_authorization }}" data-testid="settings-work-authorization"></label>
      <label>相关工作经验年限<input name="experience_years" inputmode="decimal" value="{{ profile.experience_years if profile.experience_years is not none else '' }}" data-testid="settings-experience-years"></label>
      <label>现在是否需要雇主担保<select name="sponsorship_now" required data-testid="settings-sponsorship-now"><option value="no" {% if profile.sponsorship_now=='no' %}selected{% endif %}>不需要</option><option value="yes" {% if profile.sponsorship_now=='yes' %}selected{% endif %}>需要</option><option value="uncertain" {% if profile.sponsorship_now=='uncertain' %}selected{% endif %}>不确定</option></select></label>
      <label>未来是否需要雇主担保<select name="sponsorship_future" required data-testid="settings-sponsorship-future"><option value="no" {% if profile.sponsorship_future=='no' %}selected{% endif %}>不需要</option><option value="yes" {% if profile.sponsorship_future=='yes' %}selected{% endif %}>需要</option><option value="uncertain" {% if profile.sponsorship_future=='uncertain' %}selected{% endif %}>不确定</option></select></label>
      <fieldset class="wide"><legend>工作模式</legend><div class="check-row"><label><input type="checkbox" name="work_modes" value="remote" {% if 'remote' in profile.work_mode %}checked{% endif %}>远程</label><label><input type="checkbox" name="work_modes" value="hybrid" {% if 'hybrid' in profile.work_mode %}checked{% endif %}>混合办公</label><label><input type="checkbox" name="work_modes" value="onsite" {% if 'onsite' in profile.work_mode %}checked{% endif %}>现场办公</label></div></fieldset>
      <label class="wide">已取得的专业资质<input name="professional_credentials" value="{{ profile.professional_credentials|join(', ') }}" placeholder="例如：CPA、CA、CFA、LLB、JD、PLT" data-testid="settings-credentials"></label>
      <label class="check-card"><input type="checkbox" name="credentials_confirmed" value="true" {% if profile.credentials_confirmed %}checked{% endif %} data-testid="settings-credentials-confirmed"><span><b>我已核对以上专业资质</b><small>用于严格判断岗位明确要求的资质。</small></span></label>
      <label data-specialist="legal">澳大利亚律师准入状态<select name="legal_admission" data-testid="settings-legal-admission"><option value="uncertain" {% if profile.legal_admission=='uncertain' %}selected{% endif %}>尚未确认</option><option value="admitted" {% if profile.legal_admission=='admitted' %}selected{% endif %}>已取得准入</option><option value="not_admitted" {% if profile.legal_admission=='not_admitted' %}selected{% endif %}>尚未取得</option><option value="not_applicable" {% if profile.legal_admission=='not_applicable' %}selected{% endif %}>不适用</option></select></label>
      <label data-specialist="legal">澳大利亚执业证书状态<select name="practising_certificate" data-testid="settings-practising-certificate"><option value="uncertain" {% if profile.practising_certificate=='uncertain' %}selected{% endif %}>尚未确认</option><option value="current" {% if profile.practising_certificate=='current' %}selected{% endif %}>当前有效</option><option value="held" {% if profile.practising_certificate=='held' %}selected{% endif %}>曾持有／需核对有效期</option><option value="not_current" {% if profile.practising_certificate=='not_current' %}selected{% endif %}>当前无有效证书</option><option value="not_applicable" {% if profile.practising_certificate=='not_applicable' %}selected{% endif %}>不适用</option></select></label>
      <label>是否接受搬迁<select name="relocation" data-testid="settings-relocation"><option value="">视岗位而定</option><option value="yes" {% if profile.relocation=='yes' %}selected{% endif %}>可以</option><option value="no" {% if profile.relocation=='no' %}selected{% endif %}>不可以</option></select></label>
      <label>可入职时间<input name="available_start" value="{{ profile.available_start }}" data-testid="settings-start"></label>
      <label>不接受的岗位<input name="avoid_roles" value="{{ profile.avoid_roles|join(', ') }}" data-testid="settings-avoid-roles"></label>
      <label>不接受的行业<input name="avoid_industries" value="{{ profile.avoid_industries|join(', ') }}" data-testid="settings-avoid-industries"></label>
    </div>
    <div class="form-actions"><button class="button" type="submit" data-testid="settings-profile-submit">保存并重新评估</button></div>
  </form>
</section>
{% endblock %}
