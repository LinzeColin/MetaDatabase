{% extends "base.html" %}
{% block title %}找回密码｜JobHuntBot{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>找回密码</h1>
    <p class="muted">输入注册邮箱，我们会发送一个 1 小时有效、只能使用一次的重置链接。</p>
    <form method="post" action="/forgot-password" class="form-stack" data-testid="forgot-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>邮箱<input type="email" name="email" required data-testid="forgot-email"></label>
      <button class="button full" type="submit" data-testid="forgot-submit">发送重置邮件</button>
    </form>
    <p class="auth-switch"><a href="/login" data-testid="forgot-back-login">返回登录</a></p>
  </div>
</section>
{% endblock %}
