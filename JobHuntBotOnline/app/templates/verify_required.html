{% extends "base.html" %}
{% block title %}验证邮箱｜JobHuntBot{% endblock %}
{% block content %}
<section class="center-card">
  <div class="mail-illustration">✉</div>
  <span class="eyebrow">只差一步</span>
  <h1>请打开验证邮件</h1>
  <p>打开邮件中的验证链接后，请在确认页面点击“确认验证邮箱”。这样邮件安全扫描不会提前消耗链接。链接 24 小时有效。</p>
  <a class="button" href="/login" data-testid="verify-back-login">返回登录</a>
  <a class="button ghost" href="/resend-verification" data-testid="verify-resend">没有收到邮件</a>
</section>
{% endblock %}
