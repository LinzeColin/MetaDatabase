# 业务流登记 —— 微信读书笔记迁移（WeReadPort）
#
# ★ 状态如实填。没跑起来的写 not_built,本地验收通过**不等于**线上跑通 ——
#   填成 healthy 就是造假绿。
# ★ 本项目主机上零部署单元,status 主机侧探针**永远探不到它**。
#   等它真跑起来后,按 LinzeHomeHub/status/docs/FLOW_STATE_CONTRACT.md
#   自己吐 docs/governance/flow_state.json,本站只读不写 —— 那是唯一能被实测的通道。
# ★ 后期改名时,这份文件的 project 与路径要一起改。

schema: linze.flow.v1
project: WeReadPort
repo: MetaDatabase
authority: WeReadPort/(README.md / AGENTS.md)
stages: [auth, fetch, normalize, export, handoff]
stage_names:
  auth: 密钥与会话
  fetch: 拉取笔记
  normalize: 归一化
  export: 导出
  handoff: 交接给 ChatGPT
coupling_rule: >-
  上游任一 stage 为 blocked / blocked_by_input / blocked_by_policy / not_built 时,
  下游依赖它的 stage 不得标 healthy —— 必须降级并具名上游原因。

baselines:
  - id: BL-WRP-EXPORT
    name: 笔记导出主链路
    priority: P2
    note: >-
      能力已实现且写明了安全边界(密钥/笔记/提问词不进跳转网址、附件不自动传输)。缺的是上线。
    cells:
      auth:
        state: not_built
        evidence: >-
          实现存在,但没有线上实例可跑 —— 未部署
      fetch:
        state: not_built
        evidence: >-
          同上;固定官方网关与白名单已在代码里,但没有运行环境
      normalize:
        state: not_built
        evidence: >-
          单一规范化阅读模型已实现,未上线
      export:
        state: not_built
        evidence: >-
          四种导出格式已实现,未上线
      handoff:
        state: not_built
        evidence: >-
          ChatGPT 交接流程已实现,未上线

known_defects: []
