# 参考配置：由 Codex 合并到 OVH 现有 Caddy 配置，禁止覆盖其他站点。
# 先把域名 DNS 指向 OVH，或改用现有 Cloudflare Tunnel。
weread-api.linzezhang.com {
  encode zstd gzip
  request_body { max_size 50MB }
  reverse_proxy 127.0.0.1:8788 {
    # 反代必须比 Worker 的 45 秒账户代理预算多留出余量，避免两端同时超时。
    transport http { dial_timeout 5s response_header_timeout 50s }
    header_up X-Forwarded-For {remote_host}
    header_up X-Forwarded-Proto https
  }
  header {
    Strict-Transport-Security "max-age=31536000; includeSubDomains"
    X-Content-Type-Options nosniff
    Referrer-Policy no-referrer
  }
}
