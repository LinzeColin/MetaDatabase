# 主配置：为只读根文件系统而写——pid 与所有临时目录都在 /tmp（tmpfs），日志走 stdout/stderr。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  # MIME 表：显式列出。nginx 1.25.2 起默认表把 .js 标成 text/javascript；importmap 与 ES module 要 JS 类型，
  # 这里固定用 application/javascript，两种写法浏览器都认。
  types {
    text/html                html htm;
    text/css                 css;
    application/javascript   js mjs;
    application/json         json map;
    text/plain               txt;
    image/svg+xml            svg;
    image/png                png;
    image/jpeg               jpg jpeg;
    image/webp               webp;
    image/x-icon             ico;
    font/woff2               woff2;
    application/wasm         wasm;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain image/svg+xml;

  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

  include /etc/nginx/conf.d/*.conf;
}
