# 业务流登记 —— QBVS(大数据模拟器 / Quant Behavior Validation System)
#
# ★ 全部状态取自本项目自己的 docs/governance/ASSURANCE_STATUS.yaml,
#   **不另起一套说法** —— 两份登记各写各的必然漂移。
#
#   project_id 在事实档里是 `PFI_BIG_DATA_SIMULATOR`,目录名是 QBVS。
#   这里以**目录名**为 project(status 按目录识别项目),显示名写在 name 里。
#
#   delivery_readiness.status = UNVERIFIED
#   release_gate = GOV-SEMANTIC-PFI-in-progress
#   → 不是生产上线声明,整表不得出现「已交付」口径的绿。
#
# ★★ 这是**策略验证/模拟**系统,不是交易系统。README 明写「不触发外部自动化」,
#   PFI 的投资管理不覆盖 QBVS。所以不存在「下单」这一段 —— 不是它坏了,
#   是它按设计就没有。硬造一格再标红,等于凭空制造一条永远办不完的待办。
#
# ★ 没有任何自动探针:无部署单元、无 CI 回写 flow_state.json,
#   **一格也探不到,实测覆盖 0%**,整表为自报。
#   STATUS.md 里那句 S3PCT02「lifecycle verification completed locally with
#   synthetic temporary data」—— **本机、合成数据、临时** ——
#   三个限定词一个都不能省,它不能代表真实数据下跑通。

schema: linze.flow.v1
project: QBVS
repo: MetaDatabase
authority: QBVS/docs/governance/(ASSURANCE_STATUS.yaml / STATUS.md / OWNER_STATUS.md)
stages: [config, simulate, validate, report]
stage_names:
  config: 输入配置
  simulate: 模拟运行
  validate: 结果验证
  report: 证据产出
stage_meaning:
  config: config/ 输入配置层
  simulate: qbvs/ 算法与模拟运行
  validate: tests/ 验证层,核对方法依据与实证证据
  report: runs/ 与 reports/ 的输出证据

coupling_rule: >-
  上游任一 stage 为 blocked / blocked_by_input / blocked_by_policy / not_built 时,
  下游依赖它的 stage 不得标 healthy —— 必须降级并具名上游原因。

measurement: >-
  本项目**没有任何自动探针**:无部署单元、无 CI 回写。整表为自报,实测覆盖 0%。

baselines:
  - id: BL-QBVS-SIM
    name: 大数据模拟器(策略行为验证)
    priority: P3
    note: >-
      休眠项目。结构完整性已核过,但生命周期验证只在**本机用合成临时数据**跑过,
      实证与运行验证都没过,交付就绪 UNVERIFIED。
    cells:
      config:
        state: healthy
        evidence: structural_completeness = VERIFIED(scripts/validate_project_governance.py)
        defect: 仅结构层面核过,不代表配置值本身有依据
      simulate:
        state: degraded
        evidence: >-
          implementation_congruence = PARTIAL(公式 15/15 已核,参数 211/213);
          S3PCT02 生命周期验证**只在本机、用合成临时数据**完成
      validate:
        state: blocked
        evidence: >-
          empirical_validation = UNVERIFIED、methodological_rationale = UNVERIFIED、
          **operational_validation = FAILED**;阻塞项 TASK-PFI-B-001 卡在
          「Resolve calibration evidence for strategy catalog rule constants and
          indicator thresholds」
      report:
        state: degraded
        evidence: >-
          delivery_evidence = UNVERIFIED;evidence_freshness = PARTIAL
          (tree_bound_events 0 / commit_bound 1 / legacy_unbound 3)——
          有产出,但证据与源码树的绑定不完整
