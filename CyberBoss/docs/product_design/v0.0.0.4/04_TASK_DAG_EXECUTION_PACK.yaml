  actions:
  - Run the live preflight collector once to capture memory, swap, load, disk, inode, ports and existing service consumption.
  - Inventory existing reverse proxy, systemd, containers and status ingestion without modifying unrelated services.
  - Select constrained, tiny or standard profile from measured headroom; calculate MemoryHigh/MemoryMax, disk caps and protect/recover
    predicates.
  - Inspect the existing status contract and build an adapter fixture rather than replacing the platform.
  - Identify conflicts and propose reversible port/path assignments.
  verification:
  - Compare three immediate snapshots and one induced-load snapshot; no real-time observation window.
  - Validate chosen ports and paths against current inventory.
  - Run profile calculator and resource pressure fixture.
  required_evidence:
