tasks:
- id: CB-000
  title: Pin, audit and prepare fixed local source bundles with a baseline diff map
  stage: S0
  phase: P0.1
  dependencies: []
  suggested_owner: Codex/Claude Code
  inputs:
  - WenXiaoWendy/cyberboss
  - timeline-for-agent and transitive Git dependencies
  - OpenAI Codex App Server docs
  - current taskpack and declared multi-file authority
  outputs:
  - exact historical source SHAs/tags
  - fixed local source bundles
  - dependency/license inventory
  - reuse-vs-change map
  actions:
  - Fetch/read each historical source once at the locked SHA and record version, SHA, Node engine, lockfile, copyright and license.
  - Locate WeChat poll/cursor/send, Runtime adapter, shared-start, state directories and Timeline tool integration.
  - Map every intended patch to a precise module; reject full rewrites unless a baseline failure proves necessity.
  - Prepare local fixed source bundles and replace every moving Git dependency with a local fixed package plan.
  - Prove the project has no upstream remote, submodule, `#main` dependency, automatic sync or runtime source-fetch path.
  - Record official Codex transport/auth constraints and pin the minimum compatible CLI version after protocol compatibility
    verification.
  verification:
  - Run fixed source-bundle syntax/install checks without secrets.
  - Verify the fixed local timeline-for-agent bundle is callable.
  - Verify taskpack assumptions against exact source.
  required_evidence:
  - baseline-source.md
  - fixed SHA and source-bundle hash outputs
  - dependency/license output
  risks:
  - Historical source no longer matches the recorded SHA
  - Incomplete provenance or moving dependency remains
  rollback:
  - Delete the uncommitted local source bundle and re-fetch the exact SHA into an isolated temporary directory.
  stop_conditions:
  - License is not AGPL-compatible with intended use
  - Core capabilities no longer exist in pinned source
  acceptance_criteria:
  - AC-034
  - AC-069
  pass_gate: PG-0
  status_values:
  - not_started
  - in_progress
  - activation_pending
  - hazard_blocked
  - failed
  - passed
  completion_rule: status=passed only when every claimed acceptance criterion has executable evidence. External real-adapter
    items may be activation_pending without stopping unrelated development, but may not be reported as verified.
  effort_points: 1
  parallel_continuation: If a listed stop condition affects only an external activation or hazardous action, mark that action
    activation_pending/hazard_blocked and continue every dependency-independent task.
