taskpack:
  name: CyberBoss Full-Cloud MVP
  version: v0.0.0.4
  delivery: FINAL
  date: '2026-07-26'
  timezone: Australia/Sydney
  target_domain: cyberboss.linzezhang.com
  global_status: status.linzezhang.com
  target_host: OVH Singapore; capacity selected from live preflight (constrained/tiny/standard), no hardcoded host facts
  pursuing_goal: Deploy a true all-cloud, single-user, text-first CyberBoss MVP within the 24-hour implementation window,
    with durable WeChat messaging, OVH Codex execution, Private-MetaDatabase canonical facts, Timeline/status, immediate deterministic reliability
    verification, no Mac dependency, no public Runtime transport, and no real-time soak gate.
  file_model: 7 core control files are a minimum skeleton, not a file-count limit; supplemental engineering assets are authoritative
    by declared precedence.
  verification_model: deterministic accelerated verification; no real-time soak, observation-period gate, or fixed-sleep canary
canonical_facts:
  mac_dependency: false
  primary_runtime: codex
  secondary_runtime: claude-code-disabled-by-default
  runtime_transport: ws://127.0.0.1:8765 only
  active_job_concurrency: 1
  channel: weixin-ilink-text-only
  code_repository: LinzeColin/MetaDatabase
  project_subpath: CyberBoss/
  workspace_alias: cyberboss
  workspace_default_write_scope: CyberBoss/**
  canonical_hot_store: LinzeColin/Private-Database@main/Private-MetaDatabase (domain=CyberBoss)
  canonical_access: KMOS/KMDatabase/machine/tools/private_db_client.py ingest/get/list/verify; clone forbidden
  runtime_spool: SQLite WAL, reconstructable and non-canonical
  cold_object_store: Cloudflare R2
  cold_backup: OCI Object Storage
  timeline: fixed local timeline-for-agent source bundle; no upstream remote or moving Git dependency
  service_manager: systemd
  human_ui_auth: Cloudflare Access Google/GitHub IdP
  self_heal_uses_llm: false
  core_control_files_are_minimum_not_limit: true
  real_time_soak_gate: false
  credential_wait_blocks_development: false
  max_phases_per_run: 1
  intermediate_push_allowed: false
  intermediate_pull_request_allowed: false
  final_publication_requires_all_pass_gates: true
  activation_status_values:
  - verified
  - activation_pending
  - failed
  clock_testing: injectable fake clock required for retries, TTL, reminders, check-in and lifecycle
authority_order:
- 00_README_FIRST.md
- 02_PRD_ACCEPTANCE_CONTRACT.md
- 04_TASK_DAG_EXECUTION_PACK.yaml
- 03_ARCHITECTURE_DATA_SECURITY.md
- 05_ACCELERATED_VERIFICATION_MODEL_SECURITY_RELEASE.md
- 06_OPERATIONS_STATUS_HANDOVER.md
- 09_PREAUTHORIZED_DECISIONS_ACTIVATION_INPUTS.md
- 10_TRACEABILITY_RELEASE_CHECKLIST.md
- 11_AGENT_EXECUTION_PROMPTS.md
- 08_UPSTREAM_CODE_CHANGE_MAP.md
- 01_PRFAQ_STRATEGY_OKR.md
- 07_RESEARCH_COMPETITOR_UPSTREAM_FINDINGS.md
- implementation-kit/
preauthorized_reversible_decisions:
- Create task branches and bounded Git worktrees.
- Install Node.js 22, Codex CLI, pinned application dependencies and required OS packages.
- Create the dedicated cyberboss Linux user, directories, systemd units and additive SQLite migrations.
- Use loopback WebSocket, SQLite WAL, Private-MetaDatabase content-addressed batches, R2 snapshots and Cloudflare Access.
- Run unit, integration, E2E, chaos, security, model evaluation and restore tests.
- Roll back the current symlink to the prior immutable release.
- Clean verified temporary files, old logs and old releases within the documented retention policy.
- Use provider simulators and fake credentials to complete all non-activation work when external credentials are absent.
- Use injectable clocks and immediate fault injection instead of waiting for real retry, TTL, reminder, lifecycle or observation
  intervals.
- Continue every dependency-independent DAG node when one activation or hazardous action is unavailable.
- Choose constrained, tiny or standard resource profile from live measurements and clean only verified reconstructable caches.
pass_gates:
  PG-0: Pinned sources, current architecture, simulators, live-measurement script, activation sheet and no-wait policy validate;
    no credential is required to pass repository preparation.
  PG-1: All-cloud Walking Skeleton passes with channel/runtime simulators and loopback transport; real adapters are additionally
    verified when activated.
  PG-2: Durable inbox/outbox, cursor ordering, idempotency, singleton and crash-cut recovery pass count-based deterministic
    tests.
  PG-3: Private-MetaDatabase no-clone canonical adapter, Timeline, status, adaptive resource guard and R2/OCI adapters pass real or simulator-backed
    contract tests with explicit activation state.
  PG-4: Software, model, security, privacy, license, fault-injection and restore pipelines have no unaccepted P0/P1 and no
    real-time soak.
  PG-5: Immutable candidate/current/previous release promotion, request-count canary, real activated E2E where credentials exist, rollback, restore and handover
    are verified without observation waits.
