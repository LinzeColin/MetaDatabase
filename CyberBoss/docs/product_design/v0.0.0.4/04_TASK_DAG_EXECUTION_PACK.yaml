dag_validation:
  task_count: 30
  unique_ids: true
  dependencies_exist: true
  acyclic_by_declared_order: true
  max_tasks_per_stage: 5
  real_time_soak_nodes: 0
  credential_wait_nodes: 0
  fixed_elapsed_estimate_fields: 0
  validation_commands:
  - python implementation-kit/tests/validate_task_dag.py 04_TASK_DAG_EXECUTION_PACK.yaml
  - python implementation-kit/tests/validate_no_wait.py .
hazard_action_blocks:
- condition: Would expose Codex App Server, SSH, arbitrary shell or management UI publicly
  blocked_action: that exposure only
  parallel_continuation: continue all code, simulator, test, status, backup and release-slot work
- condition: Would commit or print a real secret/private message
  blocked_action: the unsafe write/output only
  parallel_continuation: redact, rotate if needed, continue safe tasks
- condition: Would irreversibly delete user data or require destructive migration
  blocked_action: destructive mutation only
  parallel_continuation: implement additive path and isolated migration tests
- condition: Would incur unapproved paid capacity
  blocked_action: purchase/upgrade only
  parallel_continuation: select smaller profile and report evidence
- condition: WeChat reports ban/risk-control/unsupported
  blocked_action: real WeChat activation only
  parallel_continuation: finish and verify channel simulator plus all other layers
- condition: AGPL corresponding-source obligations cannot be met
  blocked_action: network service exposure only
  parallel_continuation: complete source/compliance package and internal verification
activation_dependencies:
- id: ACT-SSH
  input: OVH sudo/SSH
  when_needed: first real host mutation
  if_missing: complete repo-local code, scripts, simulators, CI and exact activation command; mark activation_pending; do
    not block other nodes
- id: ACT-WECHAT
  input: one QR scan and supported account
  when_needed: real production E2E
  if_missing: use iLink simulator and finish durable channel tests; real channel remains activation_pending
- id: ACT-CODEX
  input: one codex login --device-auth
  when_needed: real Codex E2E
  if_missing: use app-server simulator and finish control/runtime tests; auth remains activation_pending
- id: ACT-PRIVATE-DB
  input: Private-Database client identity scoped to Private-MetaDatabase
  when_needed: real canonical ingest/get/list/verify
  if_missing: use fake API with object/manifest conflict/rate-limit fixtures; real sync remains activation_pending
- id: ACT-GITHUB
  input: repo-scoped MetaDatabase code credential
  when_needed: one final publication after CB-540 and PG-0 through PG-5 pass
  if_missing: retain the fully verified local branch and mark final publication activation_pending; never push an incomplete phase
- id: ACT-CLOUDFLARE
  input: DNS, Access and R2 scoped credentials
  when_needed: public UI and real cold upload
  if_missing: finish origin, Access policy templates, local object simulator and adapter tests; mark activation_pending
- id: ACT-OCI
  input: bucket/prefix-scoped credential
  when_needed: real replica upload
  if_missing: finish adapter/mock/manifest verification; status=activation_pending; never block MVP core
