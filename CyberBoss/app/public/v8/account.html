<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户与数据｜CyberBoss</title><link rel="stylesheet" href="/styles.css"><script src="/account.js" defer></script></head><body><header class="topbar"><a class="brand" href="/home"><span class="brand-mark">C</span><span>CyberBoss</span></a><a class="quiet-link" href="/home">返回首页</a></header><main class="simple-page"><h1 class="page-title">账户与数据</h1><section class="settings-card" id="usage"><h2>AI 已准备好</h2><p><strong>DeepSeek V4 Pro · 高推理</strong></p><p>无需配置密钥、模型或供应商。五个普通用户共享平台额度；系统只保留全局 UTC 每日 10 亿 Token 闸门，不设置个人日/月额度或全局月度额度。</p><p id="usage-summary" class="feedback">正在读取聚合状态</p></section><section class="settings-card" id="import"><h2>导入聊天</h2><p>可导入 ChatGPT、Gemini、DeepSeek 和 Claude 的历史文件；上传前先检查并显示可导入数量。</p><button class="primary-button" type="button" data-action="coming">选择来源</button></section><section class="settings-card" id="profile"><h2>资料与记忆</h2><p>每条系统推断都应显示来源和可信程度，你可以拒绝或删除。</p><button class="primary-button" type="button" data-action="coming">查看我的资料</button></section><section class="settings-card" id="privacy"><h2>导出或删除</h2><p>导出会生成只属于你的文件；删除会先再次确认。</p><div class="button-row"><button class="secondary-button" id="export-button">导出我的数据</button><button class="danger-button" id="delete-button">申请删除账户</button></div></section><section class="settings-card"><h2>退出当前设备</h2><button class="secondary-button" id="logout-button">退出</button></section><p class="feedback" id="feedback" role="status"></p></main></body></html>
