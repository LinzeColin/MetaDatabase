<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__CSP_NONCE__'; style-src 'nonce-__CSP_NONCE__'; connect-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>加我聊天</title>
<style nonce="__CSP_NONCE__">
  :root{--bg:#fff;--fg:#16181d;--muted:#4a4f58;--line:#d9dce1;--card:#f7f8fa;--ok:#128a4b}
  @media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#f2f4f7;--muted:#c3c8d1;--line:#333842;--card:#1c1f25;--ok:#3ddc84}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:460px;margin:0 auto;padding:44px 22px 64px;text-align:center}
  h1{font-size:26px;margin:0 0 8px}
  .sub{color:var(--muted);margin:0 0 30px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
  #qr{width:250px;height:250px;margin:0 auto 4px;display:block;background:#fff;border-radius:12px;padding:12px}
  .say{font-size:16px;margin:18px 0 0}
  .say.good{color:var(--ok);font-weight:600}
  ol{text-align:left;color:var(--muted);font-size:14px;padding-left:22px;margin:20px 0 0;line-height:1.9}
  .note{color:var(--muted);font-size:13px;margin-top:26px}
  button{margin-top:18px;font:inherit;font-size:15px;padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>加我聊天</h1>
  <p class="sub">用微信扫一下，就能开始说话。</p>

  <div class="card">
    <img id="qr" alt="加机器人的二维码" hidden>
    <p class="say" id="say">正在给你拿一张码……</p>
    <ol id="steps" hidden>
      <li>打开微信，扫上面这个码</li>
      <li>在微信里点一下确认</li>
      <li>回到微信随便发一句话，它会回你</li>
    </ol>
    <button id="again" hidden>换一张码</button>
  </div>

  <p class="note">聊天内容会被保存下来，用来记住你说过什么。第一次说话时它会问你同不同意。</p>
</main>
<script nonce="__CSP_NONCE__">
"use strict";
(function () {
  // 这一页是给陌生人看的，所以它只问两个接口，而那两个接口只回一张二维码、
  // 一个进度词和一句中文。多少人在用、用了多少额度，这一页一个字都不该有。
  //
  // 码是**现要的**，一张只对一个人有效：iLink 的授权码本来就是一次性的，
  // 一张静态码贴给所有人扫是不成立的。

  var POLL_MS = 2000;
  var timer = null;
  var ticket = "";

  function el(id) { return document.getElementById(id); }
  function say(text, good) {
    var node = el("say");
    node.textContent = text;
    node.className = good ? "say good" : "say";
  }
  function showSteps(on) { el("steps").hidden = !on; }
  function showQr(dataUri) {
    // 只接受 data: 开头的图片——服务端就是这么给的，别的一律不显示。
    if (!/^data:image\//.test(String(dataUri || ""))) { return false; }
    var qr = el("qr");
    qr.src = dataUri;
    qr.hidden = false;
    return true;
  }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }

  function mint() {
    stop();
    el("again").hidden = true;
    el("qr").hidden = true;
    showSteps(false);
    say("正在给你拿一张码……");
    fetch("/api/join", { credentials: "omit" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ready || !showQr(d.qrDataUri)) {
          say((d && d.message) || "现在拿不到二维码，过一会儿再试。");
          el("again").hidden = false;
          return;
        }
        ticket = String(d.ticket || "");
        say(d.message || "用微信扫这个码加它。");
        showSteps(true);
        poll();
      })
      .catch(function () {
        say("现在连不上，过一会儿再试试。");
        el("again").hidden = false;
      });
  }

  function poll() {
    if (!ticket) { return; }
    fetch("/api/join/status?t=" + encodeURIComponent(ticket), { credentials: "omit" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var state = (d && d.state) || "wait";
        if (state === "confirmed") {
          stop();
          el("qr").hidden = true;
          showSteps(false);
          say((d && d.message) || "好了。回到微信，跟它说句话就行。", true);
          return;
        }
        if (state === "expired") {
          // 码过期了就自动换一张，不让人自己想办法。
          mint();
          return;
        }
        if (state === "scaned" && d.message) { say(d.message); }
        timer = setTimeout(poll, POLL_MS);
      })
      .catch(function () {
        timer = setTimeout(poll, POLL_MS);
      });
  }

  el("again").addEventListener("click", mint);
  mint();
})();
</script>
</body>
</html>
