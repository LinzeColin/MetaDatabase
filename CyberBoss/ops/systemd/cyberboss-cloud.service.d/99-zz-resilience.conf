# 让服务自己活下来，不需要有人从自己电脑上去救它。
#
# 2026-07-30 之前的实际配置是 Restart=no + TimeoutStartSec=2min +
# StartLimitBurst=3。组合起来是这样：
#
#   1. 进程 3 秒就起完了、日志也打全了，但 systemd 的 Type=notify 没在 120 秒内
#      收到 READY，于是判 "Failed with result 'timeout'"；
#   2. Restart=no —— **没有任何东西会再拉它一次**，它就那么死着；
#   3. 隧道 Requires 着它，跟着 Dependency failed，公网 530；
#   4. 直到有人（一直是我，从一台 Mac 上）手工 systemctl start。
#
# 那一天这样断了三次。"零本机依赖"在这条链路上是不成立的：服务的存活依赖着
# 一个人盯着。
#
# 这里只改存活策略，不碰任何业务配置。
[Service]
# ── 不再用 Type=notify ──────────────────────────────────
# 原来是 Type=notify，而这套握手从头到尾对不齐：
#   ExecStart 是 `flock -n <lock> run-cyberboss.sh`，systemd 跟的 MainPID 是
#   flock 那个壳；发通知的是它的**孙子**进程（cloud-supervisor.js 调
#   `systemd-notify --ready --pid=<自己>`）。
# 日志能证明通知确实发了（event=systemd_ready，systemd-notify 退出码 0），
# systemd 照样在 120 秒判 `Failed with result 'timeout'`——进程 3 秒就起完了。
# 同一个记账错误还有另一个表现：抓到过 `active (running)` 而 MainPID 指向的
# 进程已经不存在。
#
# 这一个误判是今天所有事故的起点：超时 → start-limit-hit → Restart=no 不拉起
# → 隧道被 Requires 连坐 → 公网 530 → 只能人工恢复；顺带还让每次
# `systemctl restart` 阻塞几分钟、让看门狗在 activating 状态下再踹一脚、
# 让部署脚本把好好的版本判成失败并回滚。
#
# 与其去修一个本来就对不齐的握手，不如让 systemd 别依赖它：Type=exec 表示
# "ExecStart 成功执行起来就算启动完成"。"到底能不能用"由 healthz 回答——
# 部署脚本的 verify_live 和看门狗探的都是它，那才是真判据。
Type=exec

# 不管怎么退出的都自己回来。唯一的入口没有"这次不算"的情形。
Restart=always
RestartSec=10s

# 启动超时放宽到 10 分钟。进程本身几秒就就绪了，超时来自 notify 那一跳；
# 120 秒把一个**活着的**服务判死，是这一整串事故的起点。
# 不设成 0（无限）：真卡住的时候还是要让 systemd 有权收回它并重试。
TimeoutStartSec=600

# 重启次数不设上限。上限的本意是"别把机器拖垮"，但对这个服务来说，
# 放弃重启 = 主人和所有用户一起失联，比反复重试糟糕得多。
StartLimitIntervalSec=0
StartLimitBurst=0
