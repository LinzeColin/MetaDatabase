[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfi-os"
version = "0.3.0"
description = "PFI：支付宝 / CBA 个人流水导入、自动分类、月度收支报告（本地运行，数据不进仓）。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.35", "pandas>=2.0"]
test = ["pytest>=8.0", "streamlit>=1.35", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
