{
  "data_flow": "私有仓 `Private-MetaDatabase`（数据域 `LinzeDatabase-alipay`）→ `pull` → 本机 `$PFI_DATA_DIR` → 导入（识别来源、去重）→ 分类 → 月度汇总 → 报告 / 本地界面 / 逐笔导出。全程只读原始账单，不写回私有仓，不把任何数据落进代码仓。",
  "entities": [
    {
      "entity": "流水",
      "keys": [
        "`source`",
        "`occurred_at`",
        "`amount`（负数流出）",
        "`currency`",
        "`direction`",
        "`counterparty`",
        "`description`",
        "`source_category`",
        "`status`",
        "`order_id`"
      ],
      "pk": "支付宝 `order_id`；CBA 为日期+金额+描述+同文件出现序号"
    },
    {
      "entity": "分类结果",
      "keys": [
        "`kind`",
        "`category`",
        "`reason`",
        "`needs_review`"
      ],
      "pk": "随流水"
    },
    {
      "entity": "月度汇总",
      "keys": [
        "`month`",
        "`currency`",
        "`income`",
        "`expense`",
        "`refund`",
        "`net`",
        "`investment_net`",
        "`categories`"
      ],
      "pk": "`month` + `currency`"
    }
  ]
}
